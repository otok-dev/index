api = 1
cxx-standard = ">= 20"
description = "zxing-cpp, a barcode reader and writer for linear and matrix formats: QR Code, Micro QR, rMQR, Aztec, DataMatrix, PDF417, MaxiCode, EAN/UPC, Code 39/93/128, ITF, Codabar, DataBar and others."
format = 1
keywords = [ "barcode", "qrcode", "scanner", "zxing" ]
library = "zxing-cpp"
license = "Apache-2.0 AND BSD-3-Clause AND CC0-1.0"
linkage = [ "static" ]
published = 2026-11-28T11:45:09Z
recipe = "apotocki/zxing-cpp"
recipe-sha256 = "483b47f506b75368c603f3c06537f091377701e4125318712c9427378c516b6b"
recipe-source = { commit = "b4fcfa3d03412a87200c8ab541825ffb2f2dcbcf", git = "https://github.com/otok-dev/recipes", path = "recipes/zxing-cpp/3.2/apple" }
revision = 1
source = { commit = "f66b8ab4909e2ce33a1dc68add372e8d2ef99007", git = "https://github.com/zxing-cpp/zxing-cpp", submodules = true, tag = "v3.2.0" }
variant = "apple"
version = "3.2.0"

[options.writers]
default = false
doc = "The writer of the new backend (ZXING_WRITERS = NEW: CreateBarcode.h, WriteBarcode.h), built from the bundled libzint into the ZXing library."
type = "bool"

[platforms]
build-on = [ "macos/xcode" ]
supported = [ "ios", "iossim", "macosx", "catalyst", "tvos", "tvossim", "watchos", "watchossim", "xros", "xrossim" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.16" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
