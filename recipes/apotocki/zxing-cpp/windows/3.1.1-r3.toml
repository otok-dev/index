api = 1
cxx-standard = ">= 20"
description = "zxing-cpp, a barcode reader and writer for linear and matrix formats: QR Code, Micro QR, rMQR, Aztec, DataMatrix, PDF417, MaxiCode, EAN/UPC, Code 39/93/128, ITF, Codabar, DataBar and others."
format = 1
keywords = [ "barcode", "qrcode", "scanner", "zxing" ]
library = "zxing-cpp"
license = "Apache-2.0 AND BSD-3-Clause AND CC0-1.0"
linkage = [ "static", "dynamic" ]
published = 2026-11-18T22:51:47Z
recipe = "apotocki/zxing-cpp"
recipe-sha256 = "4a3ac3651e2c3fcc0929b27047195dafad0b614a31353d7c94679d8b3371d750"
recipe-source = { commit = "df3f6c49ed5b9892656e02ec512271d6906ebf3d", git = "https://github.com/otok-dev/recipes.git", path = "recipes/zxing-cpp/3.1/windows" }
revision = 3
source = { commit = "287c85df6f961c8efbfb5ffd736cd9457b8b890e", git = "https://github.com/zxing-cpp/zxing-cpp", submodules = true, tag = "v3.1.1" }
variant = "windows"
version = "3.1.1"

[options.writers]
default = false
doc = "The writer of the new backend (ZXING_WRITERS = NEW: CreateBarcode.h, WriteBarcode.h), built from the bundled libzint into the ZXing library."
type = "bool"

[platforms]
build-on = [ "windows/msvc", "linux/clang-cl" ]
supported = [ "windows" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.16" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
