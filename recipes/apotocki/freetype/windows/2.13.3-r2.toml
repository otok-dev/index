api = 1
description = "FreeType, the font rasterizer."
format = 1
keywords = [ "font", "truetype", "rasterizer" ]
library = "freetype"
license = "FTL OR GPL-2.0-or-later"
linkage = [ "static", "dynamic" ]
recipe = "apotocki/freetype"
recipe-sha256 = "74931e2c3ac9a2c681fd3736e57cfee1f41ef535d677cfa3a856474b8535797e"
recipe-source = { commit = "0e0ec5a4fab572eca6eabb6f31874c4ec945474c", git = "https://github.com/otok-dev/recipes.git", path = "recipes/freetype/2.13/windows" }
revision = 2
source = { commit = "42608f77f20749dd6ddc9e0536788eaad70ea4b5", git = "https://gitlab.freedesktop.org/freetype/freetype.git", tag = "VER-2-13-3" }
variant = "windows"
version = "2.13.3"

[cmake.Freetype]
targets = { "Freetype::Freetype" = "FreeType" }

[platforms]
build-on = [ "windows/msvc", "linux/clang-cl" ]
supported = [ "windows" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
