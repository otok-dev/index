api = 1
description = "Lua, the embeddable scripting language, as a library."
format = 1
keywords = [ "lua", "scripting" ]
library = "lua"
license = "MIT"
linkage = [ "static", "dynamic" ]
recipe = "apotocki/lua"
recipe-sha256 = "a48cfb57080b4a693817337ecad2ee416da50e71e2caebda96638384f576839c"
recipe-source = { commit = "df3f6c49ed5b9892656e02ec512271d6906ebf3d", git = "https://github.com/otok-dev/recipes", path = "recipes/lua/5.5/linux" }
revision = 3
source = { mirrors = [ "https://www.tecgraf.puc-rio.br/lua/ftp/lua-5.5.1.tar.gz" ], sha256 = "1c4b4068d67061f2a2231ad2b5422e77acea1487ea9890f6320af614f4373dce", url = "https://www.lua.org/ftp/lua-5.5.1.tar.gz" }
variant = "linux"
version = "5.5.1"

[platforms]
build-on = [ "linux/gcc", "linux/clang" ]
