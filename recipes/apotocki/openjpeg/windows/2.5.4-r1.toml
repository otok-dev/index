revision = 1
source = { commit = "6c4a29b00211eb0430fa0e5e890f1ce5c80f409f", git = "https://github.com/uclouvain/openjpeg", tag = "v2.5.4" }
variant = "windows"
version = "2.5.4"

[platforms]
