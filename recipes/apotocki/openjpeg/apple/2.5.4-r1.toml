api = 1
description = "OpenJPEG, the reference JPEG 2000 codec library (openjp2): JPEG 2000 and HTJ2K decoding, JPEG 2000 encoding."
format = 1
keywords = [ "image", "jpeg2000", "jp2", "codec" ]
library = "openjpeg"
license = "BSD-2-Clause"
linkage = [ "static", "dynamic" ]
recipe = "apotocki/openjpeg"
recipe-sha256 = "c8fe8a1e5f9ebb29172c61a3e544c4565ce94fcf6ec8dfdd361f1441e8433cd1"
recipe-source = { commit = "b0af36dc329aaa892fd20d083d24488978e70bc2", git = "https://github.com/otok-dev/recipes.git", path = "recipes/openjpeg/2.5/apple" }
revision = 1
source = { commit = "6c4a29b00211eb0430fa0e5e890f1ce5c80f409f", git = "https://github.com/uclouvain/openjpeg", tag = "v2.5.4" }
variant = "apple"
version = "2.5.4"

[platforms]
build-on = [ "macos/xcode" ]
supported = [ "ios", "iossim", "macosx", "catalyst", "tvos", "tvossim", "watchos", "watchossim", "xros", "xrossim" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
