api = 1
description = "libtiff, the library for reading and writing TIFF images."
format = 1
keywords = [ "image", "tiff", "codec" ]
library = "libtiff"
license = "libtiff"
linkage = [ "static", "dynamic" ]
published = 2026-11-19T12:55:19Z
recipe = "apotocki/libtiff"
recipe-sha256 = "109ebdaa982893519c0b2265203a56d3acfaa52ac5c0b12f55efd4a4dc88c571"
recipe-source = { commit = "df3f6c49ed5b9892656e02ec512271d6906ebf3d", git = "https://github.com/otok-dev/recipes", path = "recipes/libtiff/4.7/linux" }
revision = 2
source = { sha256 = "672bd7d10aee4606171afb864f3570b83340f6a33e2c186dc0512f7145ffdf6a", url = "https://download.osgeo.org/libtiff/tiff-4.7.2.tar.gz" }
variant = "linux"
version = "4.7.2"

[deps.libjpeg-turbo]
default-recipe = "apotocki/libjpeg-turbo"
requires-options = { api = "libjpeg" }
version = ">= 3.0"
when = { option = "jpeg" }

[deps.libwebp]
default-recipe = "apotocki/libwebp"
version = ">= 1.0"
when = { option = "webp" }

[deps.lzma]
default-recipe = "apotocki/lzma"
version = ">= 5.2"
when = { option = "lzma" }

[deps.zlib]
default-recipe = "apotocki/zlib"
version = ">= 1.2"
when = { option = "zlib" }

[deps.zstd]
default-recipe = "apotocki/zstd"
version = ">= 1.4"
when = { option = "zstd" }

[options.jpeg]
additive = true
default = false
doc = "JPEG compression, with libjpeg (of libjpeg-turbo)."
type = "bool"

[options.lzma]
additive = true
default = false
doc = "LZMA2 compression, with liblzma."
type = "bool"

[options.webp]
additive = true
default = false
doc = "WebP compression, with libwebp."
type = "bool"

[options.zlib]
additive = true
default = true
doc = "Deflate and PixarLog compression, with zlib."
type = "bool"

[options.zstd]
additive = true
default = false
doc = "ZSTD compression, with zstd."
type = "bool"

[platforms]
build-on = [ "linux/gcc", "linux/clang" ]
supported = [ "linux" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
