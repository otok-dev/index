api = 1
description = "libtiff, the library for reading and writing TIFF images."
format = 1
keywords = [ "image", "tiff", "codec" ]
library = "libtiff"
license = "libtiff"
linkage = [ "static", "dynamic" ]
published = 2026-11-22T12:47:07Z
recipe = "apotocki/libtiff"
recipe-sha256 = "3bd16ca82429c47f0249909236ecb0ab9f0f7caa91a056875ebf7884374f5238"
recipe-source = { commit = "693ecbca5c1b1d30ada79bb00549447794a6326f", git = "https://github.com/otok-dev/recipes.git", path = "recipes/libtiff/4.7/windows" }
revision = 5
source = { sha256 = "672bd7d10aee4606171afb864f3570b83340f6a33e2c186dc0512f7145ffdf6a", url = "https://download.osgeo.org/libtiff/tiff-4.7.2.tar.gz" }
variant = "windows"
version = "4.7.2"

[deps.libjpeg-turbo]
default-recipe = "apotocki/libjpeg-turbo"
requires-options = { api = "libjpeg" }
version = ">= 3.0"
when = { option = "jpeg" }

[deps.libwebp]
default-recipe = "apotocki/libwebp"
version = ">= 1.0"
when = { option = "webp" }

[deps.lzma]
default-recipe = "apotocki/lzma"
version = ">= 5.2"
when = { option = "lzma" }

[deps.zlib]
default-recipe = "apotocki/zlib"
version = ">= 1.2"
when = { option = "zlib" }

[deps.zstd]
default-recipe = "apotocki/zstd"
version = ">= 1.4"
when = { option = "zstd" }

[options.jpeg]
additive = true
default = false
doc = "JPEG compression, with libjpeg (of libjpeg-turbo)."
type = "bool"

[options.lzma]
additive = true
default = false
doc = "LZMA2 compression, with liblzma."
type = "bool"

[options.webp]
additive = true
default = false
doc = "WebP compression, with libwebp."
type = "bool"

[options.zlib]
additive = true
default = true
doc = "Deflate and PixarLog compression, with zlib."
type = "bool"

[options.zstd]
additive = true
default = false
doc = "ZSTD compression, with zstd."
type = "bool"

[platforms]
build-on = [ "windows/msvc", "linux/clang-cl" ]
supported = [ "windows" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
