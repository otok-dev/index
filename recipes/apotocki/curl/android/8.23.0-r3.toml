api = 1
description = "libcurl, the multiprotocol file transfer library."
format = 1
keywords = [ "http", "https", "ftp", "network", "transfer", "url" ]
library = "curl"
license = "curl"
linkage = [ "static", "dynamic" ]
published = 2026-11-18T22:57:38Z
recipe = "apotocki/curl"
recipe-sha256 = "ee2ef3ce1ddec1541be4db3290936d7a4c37465857f03d3e20034e1ba1ff7a04"
recipe-source = { commit = "df3f6c49ed5b9892656e02ec512271d6906ebf3d", git = "https://github.com/otok-dev/recipes.git", path = "recipes/curl/8.23/android" }
revision = 3
source = { sha256 = "8dadd7d2536a314f982ad05a651b713f426bf7d02cc2c76cffb9796f2218e6c5", url = "https://curl.se/download/curl-8.23.0.tar.xz" }
variant = "android"
version = "8.23.0"

[deps.brotli]
default-recipe = "apotocki/brotli"
version = ">= 1.0"
when = { option = "brotli" }

[deps.libidn2]
default-recipe = "apotocki/libidn2"
version = ">= 2.0"
when = { option = "idn" }

[deps.libpsl]
default-recipe = "apotocki/libpsl"
version = ">= 0.20"
when = { option = "psl" }

[deps.libssh2]
default-recipe = "apotocki/libssh2"
version = ">= 1.11"
when = { option = "ssh" }

[deps.mbedtls]
default-recipe = "apotocki/mbedtls"
version = ">= 4.0"
when = { is = "mbedtls", option = "tls" }

[deps.nghttp2]
default-recipe = "apotocki/nghttp2"
version = ">= 1.0"
when = { option = "http2" }

[deps.nghttp3]
default-recipe = "apotocki/nghttp3"
version = ">= 1.0"
when = { option = "http3" }

[deps.ngtcp2]
default-recipe = "apotocki/ngtcp2"
version = ">= 1.12"
when = { option = "http3" }

[deps.openssl]
default-recipe = "apotocki/openssl"
version = ">= 3.0"
when = { is = "openssl", option = "tls" }

[deps.zstd]
default-recipe = "apotocki/zstd"
version = ">= 1.4"
when = { option = "zstd" }

[options.brotli]
additive = true
default = false
doc = "Content-Encoding: br, with Brotli."
type = "bool"

[options.http2]
additive = true
default = false
doc = "HTTP/2, with nghttp2."
type = "bool"

[options.http3]
additive = true
default = false
doc = "HTTP/3 over QUIC, with ngtcp2 and nghttp3. Needs tls = openssl, OpenSSL 3.5 or later (its QUIC API)."
type = "bool"

[options.idn]
additive = true
default = false
doc = "Internationalized domain names, with libidn2."
type = "bool"

[options.psl]
additive = true
default = false
doc = "The Public Suffix List, with libpsl: cookies are refused for domains that are public suffixes (co.uk)."
type = "bool"

[options.ssh]
default = false
doc = "SFTP and SCP with libssh2, which uses OpenSSL (OpenSSL is then linked whatever `tls` is)."
type = "bool"

[options.tls]
default = "mbedtls"
doc = "The TLS library: Mbed TLS or OpenSSL (the consumer gives the certificates: CURLOPT_CAINFO, CURLOPT_CAPATH or CURLOPT_CAINFO_BLOB) or none (no HTTPS)."
type = "enum"
values = [ "mbedtls", "openssl", "none" ]

[options.zstd]
additive = true
default = false
doc = "Content-Encoding: zstd, with Zstandard."
type = "bool"

[platforms]
build-on = [ "*/ndk" ]
supported = [ "android" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
