api = 1
description = "libcurl, the multiprotocol file transfer library."
format = 1
keywords = [ "http", "https", "ftp", "network", "transfer", "url" ]
library = "curl"
license = "curl"
linkage = [ "static" ]
published = 2026-11-18T17:52:18Z
recipe = "apotocki/curl"
recipe-sha256 = "a039e132d72bc5290f4e0180c104dd005d5aba52dc00b7c360dfeb704322f734"
recipe-source = { commit = "af1bbf983e2b29845be39c055995dcba366831ba", git = "https://github.com/otok-dev/recipes.git", path = "recipes/curl/8.23/windows" }
revision = 2
source = { sha256 = "8dadd7d2536a314f982ad05a651b713f426bf7d02cc2c76cffb9796f2218e6c5", url = "https://curl.se/download/curl-8.23.0.tar.xz" }
variant = "windows"
version = "8.23.0"

[deps.brotli]
default-recipe = "apotocki/brotli"
version = ">= 1.0"
when = { option = "brotli" }

[deps.libpsl]
default-recipe = "apotocki/libpsl"
version = ">= 0.20"
when = { option = "psl" }

[deps.libssh2]
default-recipe = "apotocki/libssh2"
version = ">= 1.11"
when = { option = "ssh" }

[deps.mbedtls]
default-recipe = "apotocki/mbedtls"
version = ">= 4.0"
when = { is = "mbedtls", option = "tls" }

[deps.nghttp2]
default-recipe = "apotocki/nghttp2"
version = ">= 1.0"
when = { option = "http2" }

[deps.nghttp3]
default-recipe = "apotocki/nghttp3"
version = ">= 1.0"
when = { option = "http3" }

[deps.ngtcp2]
default-recipe = "apotocki/ngtcp2"
version = ">= 1.12"
when = { option = "http3" }

[deps.openssl]
default-recipe = "apotocki/openssl"
version = ">= 3.0"
when = { is = "openssl", option = "tls" }

[deps.zlib]
default-recipe = "apotocki/zlib"
version = ">= 1.2"

[deps.zstd]
default-recipe = "apotocki/zstd"
version = ">= 1.4"
when = { option = "zstd" }

[options.brotli]
additive = true
default = false
doc = "Content-Encoding: br, with Brotli."
type = "bool"

[options.http2]
additive = true
default = false
doc = "HTTP/2, with nghttp2."
type = "bool"

[options.http3]
additive = true
default = false
doc = "HTTP/3 over QUIC, with ngtcp2 and nghttp3. Needs tls = openssl, OpenSSL 3.5 or later (its QUIC API)."
type = "bool"

[options.idn]
additive = true
default = false
doc = "Internationalized domain names, with Windows' own IDNA (normaliz)."
type = "bool"

[options.psl]
additive = true
default = false
doc = "The Public Suffix List, with libpsl: cookies are refused for domains that are public suffixes (co.uk)."
type = "bool"

[options.ssh]
default = false
doc = "SFTP and SCP with libssh2 (its WinCNG backend)."
type = "bool"

[options.tls]
default = "schannel"
doc = "The TLS library: Schannel (Windows' own, with the system's certificates), OpenSSL or Mbed TLS (the consumer gives the certificates: CURLOPT_CAINFO or CURLOPT_CAINFO_BLOB) or none (no HTTPS)."
type = "enum"
values = [ "schannel", "openssl", "mbedtls", "none" ]

[options.zstd]
additive = true
default = false
doc = "Content-Encoding: zstd, with Zstandard."
type = "bool"

[platforms]
build-on = [ "windows/msvc", "linux/clang-cl" ]
supported = [ "windows" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
