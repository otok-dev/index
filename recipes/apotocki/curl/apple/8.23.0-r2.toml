api = 1
description = "libcurl, the multiprotocol file transfer library."
format = 1
keywords = [ "http", "https", "ftp", "network", "transfer", "url" ]
library = "curl"
license = "curl"
linkage = [ "static", "dynamic" ]
published = 2026-11-19T12:36:47Z
recipe = "apotocki/curl"
recipe-sha256 = "8f4fb1f5ef3701e59001c81ef00775977483d0d21b2f4e48505e084abf01134c"
recipe-source = { commit = "df3f6c49ed5b9892656e02ec512271d6906ebf3d", git = "https://github.com/otok-dev/recipes.git", path = "recipes/curl/8.23/apple" }
revision = 2
source = { sha256 = "8dadd7d2536a314f982ad05a651b713f426bf7d02cc2c76cffb9796f2218e6c5", url = "https://curl.se/download/curl-8.23.0.tar.xz" }
variant = "apple"
version = "8.23.0"

[deps.brotli]
default-recipe = "apotocki/brotli"
version = ">= 1.0"
when = { option = "brotli" }

[deps.libpsl]
default-recipe = "apotocki/libpsl"
version = ">= 0.20"
when = { option = "psl" }

[deps.libssh2]
default-recipe = "apotocki/libssh2"
version = ">= 1.11"
when = { option = "ssh" }

[deps.mbedtls]
default-recipe = "apotocki/mbedtls"
version = ">= 4.0"
when = { is = "mbedtls", option = "tls" }

[deps.nghttp2]
default-recipe = "apotocki/nghttp2"
version = ">= 1.0"
when = { option = "http2" }

[deps.nghttp3]
default-recipe = "apotocki/nghttp3"
version = ">= 1.0"
when = { option = "http3" }

[deps.ngtcp2]
default-recipe = "apotocki/ngtcp2"
version = ">= 1.12"
when = { option = "http3" }

[deps.openssl]
default-recipe = "apotocki/openssl"
version = ">= 3.0"
when = { is = "openssl", option = "tls" }

[deps.zstd]
default-recipe = "apotocki/zstd"
version = ">= 1.4"
when = { option = "zstd" }

[options.brotli]
additive = true
default = false
doc = "Content-Encoding: br, with Brotli."
type = "bool"

[options.http2]
additive = true
default = false
doc = "HTTP/2, with nghttp2."
type = "bool"

[options.http3]
additive = true
default = false
doc = "HTTP/3 over QUIC, with ngtcp2 and nghttp3. Needs tls = openssl, OpenSSL 3.5 or later (its QUIC API)."
type = "bool"

[options.idn]
additive = true
default = false
doc = "Internationalized domain names, with the system's own IDNA (Apple: libicucore)."
type = "bool"

[options.psl]
additive = true
default = false
doc = "The Public Suffix List, with libpsl: cookies are refused for domains that are public suffixes (co.uk)."
type = "bool"

[options.ssh]
default = true
doc = "SFTP and SCP with libssh2, which uses OpenSSL (OpenSSL is then linked whatever `tls` is)."
type = "bool"

[options.tls]
default = "openssl"
doc = "The TLS library: OpenSSL, whose certificates are verified by the system's Security framework, Mbed TLS (the consumer sets the certificates, CURLOPT_CAINFO_BLOB), or none (no HTTPS)."
type = "enum"
values = [ "openssl", "mbedtls", "none" ]

[options.zstd]
additive = true
default = false
doc = "Content-Encoding: zstd, with Zstandard."
type = "bool"

[platforms]
build-on = [ "macos/xcode" ]
supported = [ "ios", "iossim", "macosx", "catalyst", "tvos", "tvossim", "watchos", "watchossim", "xros", "xrossim" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
