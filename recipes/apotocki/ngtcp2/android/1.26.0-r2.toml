api = 1
description = "ngtcp2, an implementation of the IETF QUIC protocol (RFC 9000) in C, with OpenSSL as its TLS."
format = 1
keywords = [ "quic", "http3", "tls" ]
library = "ngtcp2"
license = "MIT"
linkage = [ "static", "dynamic" ]
recipe = "apotocki/ngtcp2"
recipe-sha256 = "59f39aa7214bca0247416704641ef8992621c27a7346c2cc0f157fe6de059521"
recipe-source = { commit = "af1bbf983e2b29845be39c055995dcba366831ba", git = "https://github.com/otok-dev/recipes.git", path = "recipes/ngtcp2/1.26/android" }
revision = 2
source = { sha256 = "7804aa0fa1c39942ba322a90805824c37231f7675b08d0c3cc4332858a7b085e", url = "https://github.com/ngtcp2/ngtcp2/releases/download/v1.26.0/ngtcp2-1.26.0.tar.xz" }
variant = "android"
version = "1.26.0"

[deps.openssl]
default-recipe = "apotocki/openssl"
version = ">= 3.5"

[platforms]
build-on = [ "*/ndk" ]
supported = [ "android" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
