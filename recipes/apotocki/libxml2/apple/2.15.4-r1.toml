api = 1
description = "libxml2, the XML C parser and toolkit of GNOME."
format = 1
keywords = [ "xml", "html", "xpath", "parser" ]
library = "libxml2"
license = "MIT"
linkage = [ "static", "dynamic" ]
recipe = "apotocki/libxml2"
recipe-sha256 = "79865847450a207d69ffbb7f006eec842d22442afd2b022ace3a206bc7a3c8d0"
recipe-source = { commit = "1ea16409510454b8ee22a4a83ff304e3e03808c4", git = "https://github.com/otok-dev/recipes.git", path = "recipes/libxml2/2.15/apple" }
revision = 1
source = { sha256 = "98087fd181d9070724f3fbc65c7377db03038eb92bd882374daff44940138821", url = "https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.4.tar.xz" }
variant = "apple"
version = "2.15.4"

[options.zlib]
additive = true
default = false
type = "bool"

[platforms]
build-on = [ "macos/xcode" ]
supported = [ "ios", "iossim", "macosx", "catalyst", "tvos", "tvossim", "watchos", "watchossim", "xros", "xrossim" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
