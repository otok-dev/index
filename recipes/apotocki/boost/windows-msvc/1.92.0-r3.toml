api = 1
cxx-standard = ">= 11"
description = "Boost C++ libraries: the headers, and the compiled libraries a project selects."
format = 1
keywords = [ "boost", "cpp" ]
library = "boost"
license = "BSL-1.0"
linkage = [ "static", "dynamic" ]
published = 2026-11-18T17:11:09Z
recipe = "apotocki/boost"
recipe-sha256 = "d7c7c8c5de6bc233fb8ea826222e4eced4f7225f508afdea60885f9fb73a9a63"
recipe-source = { commit = "12a2a825458298bb82d389747fe69eb6f8c97a02", git = "https://github.com/otok-dev/recipes.git", path = "recipes/boost/1.92/windows-msvc" }
revision = 3
source = { mirrors = [ "https://sourceforge.net/projects/boost/files/boost/1.92.0/boost_1_92_0.tar.bz2" ], sha256 = "5c1d40cb8e19adbf740a4ec2da35b3e58f3f5804b1dce44deb53df72193cbc6c", url = "https://archives.boost.io/release/1.92.0/source/boost_1_92_0.tar.bz2" }
variant = "windows-msvc"
version = "1.92.0"

[deps.icu4c]
default-recipe = "apotocki/icu4c"
version = ">= 70"
when = { option = "icu" }

[options.icu]
default = false
doc = "ICU (the icu4c recipe) as the backend of Boost.Locale and for the Unicode support of Boost.Regex (boost/regex/icu.hpp). The products of Boost then hold ICU's libraries, which a static link takes only as far as it uses them."
type = "bool"

[options.libraries]
additive = true
default = []
doc = "The compiled libraries to build (b2 --with-<library>); each becomes a product. Without any, Boost is its headers."
type = "list"
values = [
"atomic",
"charconv",
"chrono",
"cobalt",
"container",
"context",
"contract",
"coroutine",
"date_time",
"exception",
"fiber",
"filesystem",
"graph",
"iostreams",
"json",
"locale",
"log",
"math",
"nowide",
"process",
"program_options",
"random",
"regex",
"serialization",
"stacktrace",
"test",
"thread",
"timer",
"type_erasure",
"url",
"wave"
]

[platforms]
build-on = [ "windows/msvc" ]
supported = [ "windows" ]
