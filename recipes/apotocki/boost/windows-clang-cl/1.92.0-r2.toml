api = 1
cxx-standard = ">= 11"
description = "Boost C++ libraries: the headers, and the compiled libraries a project selects."
format = 1
keywords = [ "boost", "cpp" ]
library = "boost"
license = "BSL-1.0"
linkage = [ "static", "dynamic" ]
published = 2026-11-19T12:42:26Z
recipe = "apotocki/boost"
recipe-sha256 = "7ec7e668cd3529712f49255a5508cbf22a825723beccfcc0e76a0215c8618b9e"
recipe-source = { commit = "df3f6c49ed5b9892656e02ec512271d6906ebf3d", git = "https://github.com/otok-dev/recipes", path = "recipes/boost/1.92/windows-clang-cl" }
revision = 2
source = { mirrors = [ "https://sourceforge.net/projects/boost/files/boost/1.92.0/boost_1_92_0.tar.bz2" ], sha256 = "5c1d40cb8e19adbf740a4ec2da35b3e58f3f5804b1dce44deb53df72193cbc6c", url = "https://archives.boost.io/release/1.92.0/source/boost_1_92_0.tar.bz2" }
variant = "windows-clang-cl"
version = "1.92.0"

[deps.icu4c]
default-recipe = "apotocki/icu4c"
version = ">= 70"
when = { option = "icu" }

[options.icu]
default = false
doc = "ICU (the icu4c recipe) as the backend of Boost.Locale and for the Unicode support of Boost.Regex (boost/regex/icu.hpp). The products of Boost then hold ICU's libraries, which a static link takes only as far as it uses them."
type = "bool"

[options.libraries]
additive = true
default = []
doc = "The compiled libraries to build (b2 --with-<library>); each becomes a product. Without any, Boost is its headers."
type = "list"
values = [
"atomic",
"charconv",
"chrono",
"cobalt",
"container",
"context",
"contract",
"coroutine",
"date_time",
"exception",
"fiber",
"filesystem",
"graph",
"iostreams",
"json",
"locale",
"log",
"math",
"nowide",
"process",
"program_options",
"random",
"regex",
"serialization",
"stacktrace",
"test",
"thread",
"timer",
"type_erasure",
"url",
"wave"
]

[platforms]
build-on = [ "linux/clang-cl" ]
supported = [ "windows" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
