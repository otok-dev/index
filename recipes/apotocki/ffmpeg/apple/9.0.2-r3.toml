api = 1
c-standard = ">= 11"
description = "FFmpeg's libraries (avutil, avcodec, avformat, avfilter, swscale, swresample) under the LGPL."
format = 1
keywords = [ "video", "audio", "codec", "multimedia", "ffmpeg" ]
library = "ffmpeg"
license = "LGPL-2.1-or-later"
linkage = [ "static", "dynamic" ]
published = 2026-11-20T13:13:37Z
recipe = "apotocki/ffmpeg"
recipe-sha256 = "a8a9198cb88d641b7cfd904fc6117344aa18c123b79e674df2ef4a182545abad"
recipe-source = { commit = "e905a5a7991b69436a427354f7922eaaccfb8c24", git = "https://github.com/otok-dev/recipes.git", path = "recipes/ffmpeg/9.0/apple" }
revision = 3
source = { commit = "946fcce07b6dcd0331c8cc609192aeff5e1924f8", git = "https://github.com/FFmpeg/FFmpeg", tag = "n9.0.2" }
variant = "apple"
version = "9.0.2"

[deps.dav1d]
default-recipe = "apotocki/dav1d"
version = ">= 1.0"
when = { option = "dav1d" }

[options.dav1d]
default = true
doc = "AV1 decoding with dav1d (the decoder libdav1d), much faster than FFmpeg's own AV1 decoder."
type = "bool"

[platforms]
build-on = [ "macos/xcode" ]
supported = [ "ios", "iossim", "macosx", "catalyst", "tvos", "tvossim", "xros", "xrossim" ]

[toolchains]
make = { default-recipe = "apotocki/make", version = ">= 3.81" }
nasm = { default-recipe = "apotocki/nasm", version = ">= 2.13", when = { arch = [ "x86_64" ] } }
pkg-config = { default-recipe = "apotocki/pkgconf", version = ">= 1" }
