api = 1
c-standard = ">= 11"
description = "FFmpeg's libraries (avutil, avcodec, avformat, avfilter, swscale, swresample) under the LGPL."
format = 1
keywords = [ "video", "audio", "codec", "multimedia", "ffmpeg" ]
library = "ffmpeg"
license = "LGPL-2.1-or-later"
linkage = [ "static", "dynamic" ]
published = 2026-11-20T12:51:55Z
recipe = "apotocki/ffmpeg"
recipe-sha256 = "a603d02e20494e9ba86e32b6b62d30d282ef28d6df29ac5a97c245fdbd4b56dc"
recipe-source = { commit = "e3ad7a5d3047fddcee478ee8c80b04e121246143", git = "https://github.com/otok-dev/recipes.git", path = "recipes/ffmpeg/9.0/windows" }
revision = 3
source = { commit = "946fcce07b6dcd0331c8cc609192aeff5e1924f8", git = "https://github.com/FFmpeg/FFmpeg", tag = "n9.0.2" }
variant = "windows"
version = "9.0.2"

[deps.dav1d]
default-recipe = "apotocki/dav1d"
version = ">= 1.0"
when = { option = "dav1d" }

[deps.zlib]
default-recipe = "apotocki/zlib"
version = ">= 1.2"

[options.dav1d]
default = true
type = "bool"

[platforms]
architectures = { windows = [ "x86_64" ] }
build-on = [ "windows/msvc" ]
supported = [ "windows" ]

[toolchains]
make = { default-recipe = "apotocki/make", version = ">= 3.81" }
nasm = { default-recipe = "apotocki/nasm", version = ">= 2.13", when = { arch = [ "x86_64" ] } }
pkg-config = { default-recipe = "apotocki/pkgconf", version = ">= 1" }
