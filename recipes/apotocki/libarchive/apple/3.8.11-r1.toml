api = 1
description = "libarchive, a library reading and writing tar, cpio, zip, 7-Zip, RAR, ISO 9660, XAR and other archive and compression formats, with bsdtar and bsdunzip."
format = 1
keywords = [ "archive", "tar", "zip", "7z", "compression" ]
library = "libarchive"
license = "BSD-2-Clause AND BSD-3-Clause AND (CC0-1.0 OR OpenSSL OR Apache-2.0)"
linkage = [ "static", "dynamic" ]
published = 2026-11-14T19:59:19Z
recipe = "apotocki/libarchive"
recipe-sha256 = "1ca1c7ed10c471f39d0ce074769ddf3bb5c7e1e15346efb508475e378f6806b3"
recipe-source = { commit = "38eb6de92a0f69e47500c65fdf47bbfc088321f1", git = "https://github.com/otok-dev/recipes.git", path = "recipes/libarchive/3.8/apple" }
revision = 1
source = { mirrors = [ "https://www.libarchive.org/downloads/libarchive-3.8.11.tar.xz" ], sha256 = "a3dc0872b1b39da34dc18ef1b944f0f11ffd37425d70ae04be679279f1cf43d2", url = "https://github.com/libarchive/libarchive/releases/download/v3.8.11/libarchive-3.8.11.tar.xz" }
variant = "apple"
version = "3.8.11"

[deps.bzip2]
default-recipe = "apotocki/bzip2"
linkage = "static"
version = ">= 1.0"
when = { option = "bzip2" }

[deps.expat]
default-recipe = "apotocki/expat"
version = ">= 2.0"
when = { is = "expat", option = "xml" }

[deps.libxml2]
default-recipe = "apotocki/libxml2"
version = ">= 2.9"
when = { is = "libxml2", option = "xml" }

[deps.lz4]
default-recipe = "apotocki/lz4"
linkage = "static"
version = ">= 1.7"
when = { option = "lz4" }

[deps.lzma]
default-recipe = "apotocki/lzma"
linkage = "static"
version = ">= 5.0"
when = { option = "lzma" }

[deps.zstd]
default-recipe = "apotocki/zstd"
version = ">= 1.4"
when = { option = "zstd" }

[options.bzip2]
additive = true
default = true
type = "bool"

[options.lz4]
additive = true
default = true
type = "bool"

[options.lzma]
additive = true
default = true
type = "bool"

[options.xml]
default = "libxml2"
type = "enum"
values = [ "libxml2", "expat", "none" ]

[options.zlib]
additive = true
default = true
type = "bool"

[options.zstd]
additive = true
default = true
type = "bool"

[platforms]
build-on = [ "macos/xcode" ]
supported = [ "ios", "iossim", "macosx", "catalyst", "tvos", "tvossim", "watchos", "watchossim", "xros", "xrossim" ]

[tool]
programs = [ "bsdtar", "bsdunzip" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
