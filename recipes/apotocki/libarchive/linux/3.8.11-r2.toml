api = 1
description = "libarchive, a library reading and writing tar, cpio, zip, 7-Zip, RAR, ISO 9660, XAR and other archive and compression formats, with bsdtar and bsdunzip."
format = 1
keywords = [ "archive", "tar", "zip", "7z", "compression" ]
library = "libarchive"
license = "BSD-2-Clause AND BSD-3-Clause AND (CC0-1.0 OR OpenSSL OR Apache-2.0)"
linkage = [ "static", "dynamic" ]
recipe = "apotocki/libarchive"
recipe-sha256 = "ff1c348806973afaac3625d0f080a138ed9c0a041b866a2c73d838ec38afb207"
recipe-source = { commit = "df3f6c49ed5b9892656e02ec512271d6906ebf3d", git = "https://github.com/otok-dev/recipes", path = "recipes/libarchive/3.8/linux" }
revision = 2
source = { mirrors = [ "https://www.libarchive.org/downloads/libarchive-3.8.11.tar.xz" ], sha256 = "a3dc0872b1b39da34dc18ef1b944f0f11ffd37425d70ae04be679279f1cf43d2", url = "https://github.com/libarchive/libarchive/releases/download/v3.8.11/libarchive-3.8.11.tar.xz" }
variant = "linux"
version = "3.8.11"

[deps.bzip2]
default-recipe = "apotocki/bzip2"
version = ">= 1.0"
when = { option = "bzip2" }

[deps.expat]
default-recipe = "apotocki/expat"
version = ">= 2.0"
when = { is = "expat", option = "xml" }

[deps.libacl]
default-recipe = "apotocki/libacl"
version = ">= 2.2"
when = { option = "acl" }

[deps.libxml2]
default-recipe = "apotocki/libxml2"
version = ">= 2.9"
when = { is = "libxml2", option = "xml" }

[deps.lz4]
default-recipe = "apotocki/lz4"
version = ">= 1.7"
when = { option = "lz4" }

[deps.lzma]
default-recipe = "apotocki/lzma"
version = ">= 5.0"
when = { option = "lzma" }

[deps.openssl]
default-recipe = "apotocki/openssl"
version = ">= 3.0"
when = { is = "openssl", option = "crypto" }

[deps.zlib]
default-recipe = "apotocki/zlib"
version = ">= 1.2.1"
when = { option = "zlib" }

[deps.zstd]
default-recipe = "apotocki/zstd"
version = ">= 1.4"
when = { option = "zstd" }

[options.acl]
additive = true
default = true
type = "bool"

[options.bzip2]
additive = true
default = true
type = "bool"

[options.crypto]
default = "openssl"
type = "enum"
values = [ "openssl", "none" ]

[options.lz4]
additive = true
default = true
type = "bool"

[options.lzma]
additive = true
default = true
type = "bool"

[options.xml]
default = "libxml2"
type = "enum"
values = [ "expat", "libxml2", "none" ]

[options.zlib]
additive = true
default = true
type = "bool"

[options.zstd]
additive = true
default = true
type = "bool"

[platforms]
build-on = [ "linux/gcc", "linux/clang" ]
supported = [ "linux" ]

[tool]
programs = [ "bsdtar", "bsdunzip" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
