api = 1
description = "libarchive, a library reading and writing tar, cpio, zip, 7-Zip, RAR, ISO 9660, XAR and other archive and compression formats."
format = 1
keywords = [ "archive", "tar", "zip", "7z", "compression" ]
library = "libarchive"
license = "BSD-2-Clause AND BSD-3-Clause AND (CC0-1.0 OR OpenSSL OR Apache-2.0)"
linkage = [ "static", "dynamic" ]
published = 2026-11-14T19:54:17Z
recipe = "apotocki/libarchive"
recipe-sha256 = "6091f7a04689b0817a51e3a27ee0941dec5e6486c4aa1ec574b704f6c69b3497"
recipe-source = { commit = "38eb6de92a0f69e47500c65fdf47bbfc088321f1", git = "https://github.com/otok-dev/recipes.git", path = "recipes/libarchive/3.8/android" }
revision = 1
source = { mirrors = [ "https://www.libarchive.org/downloads/libarchive-3.8.11.tar.xz" ], sha256 = "a3dc0872b1b39da34dc18ef1b944f0f11ffd37425d70ae04be679279f1cf43d2", url = "https://github.com/libarchive/libarchive/releases/download/v3.8.11/libarchive-3.8.11.tar.xz" }
variant = "android"
version = "3.8.11"

[deps.bzip2]
default-recipe = "apotocki/bzip2"
version = ">= 1.0"
when = { option = "bzip2" }

[deps.expat]
default-recipe = "apotocki/expat"
version = ">= 2.0"
when = { is = "expat", option = "xml" }

[deps.libxml2]
default-recipe = "apotocki/libxml2"
version = ">= 2.9"
when = { is = "libxml2", option = "xml" }

[deps.lz4]
default-recipe = "apotocki/lz4"
version = ">= 1.7"
when = { option = "lz4" }

[deps.lzma]
default-recipe = "apotocki/lzma"
version = ">= 5.0"
when = { option = "lzma" }

[deps.openssl]
default-recipe = "apotocki/openssl"
version = ">= 3.0"
when = { is = "openssl", option = "crypto" }

[deps.zstd]
default-recipe = "apotocki/zstd"
version = ">= 1.4"
when = { option = "zstd" }

[options.bzip2]
additive = true
default = true
doc = "bzip2, and bzip2 in zip, 7-Zip and XAR, with bzip2."
type = "bool"

[options.crypto]
default = "openssl"
doc = "OpenSSL for traditional and AES encryption of zip, the digests of XAR, mtree and WARC; none leaves them out."
type = "enum"
values = [ "openssl", "none" ]

[options.lz4]
additive = true
default = true
doc = "lz4, with lz4."
type = "bool"

[options.lzma]
additive = true
default = true
doc = "xz, lzma and lzip, and LZMA in zip, 7-Zip and XAR, with liblzma."
type = "bool"

[options.xml]
default = "expat"
doc = "The XML library of the XAR format: Expat (reading only), libxml2 (reading and writing; API level 28 or later, for iconv), or none (no XAR)."
type = "enum"
values = [ "expat", "libxml2", "none" ]

[options.zlib]
additive = true
default = true
doc = "gzip, deflate in zip, and the formats that need it (ISO 9660 zisofs, XAR, 7-Zip deflate), with the NDK's zlib."
type = "bool"

[options.zstd]
additive = true
default = true
doc = "zstd, and zstd in zip and 7-Zip, with zstd."
type = "bool"

[platforms]
build-on = [ "*/ndk" ]
supported = [ "android" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
