api = 1
description = "GNU Bison, the parser generator, built from source."
format = 1
keywords = [ "parser", "generator", "yacc", "tool" ]
library = "bison"
license = "GPL-3.0-or-later"
recipe = "apotocki/bison"
recipe-sha256 = "67d55b01ce7d9c44e7e858df73f21f6c40018678b7c7a1ab9e13dc643d202db7"
recipe-source = { commit = "b7e558f8376894485944baffded9182f05fb8e61", git = "https://github.com/otok-dev/recipes", path = "recipes/bison/3.8/linux" }
revision = 1
source = { mirrors = [ "https://ftpmirror.gnu.org/gnu/bison/bison-3.8.2.tar.xz" ], sha256 = "9bba0214ccf7f1079c5d59210045227bcf619519840ebfa80cd3849cff5a5bf2", url = "https://ftp.gnu.org/gnu/bison/bison-3.8.2.tar.xz" }
variant = "linux"
version = "3.8.2"

[platforms]
build-on = [ "linux/gcc", "linux/clang" ]
supported = [ "linux" ]

[tool]
programs = [ "bison" ]

[tool-deps.m4]
default-recipe = "apotocki/m4"
version = ">= 1.4.6"

[toolchains]
make = { default-recipe = "apotocki/make", version = ">= 3.81" }
