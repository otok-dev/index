api = 1
description = "GNU Bison, the parser generator, built from source."
format = 1
keywords = [ "parser", "generator", "yacc", "tool" ]
library = "bison"
license = "GPL-3.0-or-later"
recipe = "apotocki/bison"
recipe-sha256 = "745c3a1179a669930e63883335b875d1ca63b20f5a221972b6f87b49fa40e051"
recipe-source = { commit = "b7e558f8376894485944baffded9182f05fb8e61", git = "https://github.com/otok-dev/recipes.git", path = "recipes/bison/3.8/apple" }
revision = 1
source = { mirrors = [ "https://ftpmirror.gnu.org/gnu/bison/bison-3.8.2.tar.xz" ], sha256 = "9bba0214ccf7f1079c5d59210045227bcf619519840ebfa80cd3849cff5a5bf2", url = "https://ftp.gnu.org/gnu/bison/bison-3.8.2.tar.xz" }
variant = "apple"
version = "3.8.2"

[platforms]
build-on = [ "macos/xcode" ]
supported = [ "macosx" ]

[tool]
programs = [ "bison" ]

[tool-deps.m4]
default-recipe = "apotocki/m4"
version = ">= 1.4.6"

[toolchains]
make = { default-recipe = "apotocki/make", version = ">= 3.81" }
