api = 1
description = "libssh2, a client-side C library implementing the SSH2 protocol."
format = 1
keywords = [ "ssh", "sftp" ]
library = "libssh2"
license = "BSD-3-Clause"
linkage = [ "static", "dynamic" ]
recipe = "apotocki/libssh2"
recipe-sha256 = "92db4f183d0a9ef660587d3c6ae76a8e202d7edd568e09de22576a5297b41afb"
recipe-source = { commit = "df3f6c49ed5b9892656e02ec512271d6906ebf3d", git = "https://github.com/otok-dev/recipes", path = "recipes/libssh2/1.11/linux" }
revision = 2
source = { sha256 = "d9ec76cbe34db98eec3539fe2c899d26b0c837cb3eb466a56b0f109cabf658f7", url = "https://libssh2.org/download/libssh2-1.11.1.tar.gz" }
variant = "linux"
version = "1.11.1"

[deps.openssl]
default-recipe = "apotocki/openssl"
version = ">= 3.0"

[deps.zlib]
default-recipe = "apotocki/zlib"
version = ">= 1.2"

[platforms]
build-on = [ "linux/gcc", "linux/clang" ]
supported = [ "linux" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
