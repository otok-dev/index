api = 1
cxx-standard = ">= 14"
description = "Cairo, the 2D graphics library, for Windows: GDI, DirectWrite and, as an option, Direct2D."
format = 1
keywords = [ "graphics", "2d", "vector", "direct2d" ]
library = "cairo"
license = "LGPL-2.1-only OR MPL-1.1"
linkage = [ "static", "dynamic" ]
recipe = "apotocki/cairo"
recipe-sha256 = "929463d9f8432f3de72f9c7d87452cf6f0ff5a9f3ba67423f6a758bae03a604e"
recipe-source = { commit = "acde6a277b028464290fcac2fd89c0cfef87f9f1", git = "https://github.com/otok-dev/recipes", path = "recipes/cairo/1.18/windows" }
revision = 1
source = { sha256 = "1c767308174337a74694da0f3ec069c271452163a1ef4540964c50c301f157d4", url = "https://cairographics.org/releases/cairo-1.18.6.tar.xz" }
variant = "windows"
version = "1.18.6"

[deps.freetype]
default-recipe = "apotocki/freetype"
linkage = "static"
version = ">= 2.10"

[deps.libpng]
default-recipe = "apotocki/libpng"
linkage = "static"
version = ">= 1.6"

[deps.pixman]
default-recipe = "apotocki/pixman"
linkage = "static"
version = ">= 0.40"

[deps.zlib]
default-recipe = "apotocki/zlib"
version = ">= 1.2"

[options.d2d]
default = false
doc = "The Direct2D surface on Direct3D 10.1 and 11 (CAIRO_HAS_D2D_SURFACE, cairo_d2d_* in cairo-win32.h), its CSS blend modes and GPU drop shadow: the branch d2d of apotocki/cairo."
type = "bool"

[platforms]
build-on = [ "windows/msvc", "linux/clang-cl" ]
supported = [ "windows" ]

[toolchains]
meson = { default-recipe = "apotocki/meson", version = ">= 1.3" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
pkg-config = { default-recipe = "apotocki/pkgconf", version = ">= 1" }

[[resource]]
commit = "94c276728073dc24c2eb6329f6f593b1168740f1"
git = "https://github.com/apotocki/cairo"
name = "d2d"
