api = 1
description = "OpenSSL (libssl, libcrypto), built from source."
format = 1
keywords = [ "tls", "crypto" ]
library = "openssl"
license = "Apache-2.0"
linkage = [ "static", "dynamic" ]
recipe = "apotocki/openssl"
recipe-sha256 = "60df287910220d6a4f9842801404d2b44cff3fab06845191d21a034b383fcb23"
recipe-source = { commit = "df3f6c49ed5b9892656e02ec512271d6906ebf3d", git = "https://github.com/otok-dev/recipes.git", path = "recipes/openssl/4.1/android" }
revision = 3
source = { commit = "2f4e3a5fec05394068cfa7379890ab552483a8a6", git = "https://github.com/openssl/openssl", tag = "openssl-4.1.0" }
variant = "android"
version = "4.1.0"

[options.no-deprecated]
default = false
type = "bool"

[platforms]
build-on = [ "*/ndk" ]
supported = [ "android" ]

[toolchains]
make = { default-recipe = "apotocki/make", version = ">= 3.81" }
perl = { default-recipe = "apotocki/perl", version = ">= 5.30", when = { environment = [ "linux/ndk", "macos/ndk" ] } }
