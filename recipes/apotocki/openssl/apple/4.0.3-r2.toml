api = 1
description = "OpenSSL (libssl, libcrypto), built from source."
format = 1
keywords = [ "tls", "crypto" ]
library = "openssl"
license = "Apache-2.0"
recipe = "apotocki/openssl"
recipe-sha256 = "5ea0aced880145fd49b433109be1e1326c8ca9322c042a966f41bb547c43fb54"
recipe-source = { commit = "df3f6c49ed5b9892656e02ec512271d6906ebf3d", git = "https://github.com/otok-dev/recipes.git", path = "recipes/openssl/4.0/apple" }
revision = 2
source = { commit = "af1775b60dfa141a4ad762585052cabeb9f37e9e", git = "https://github.com/openssl/openssl", tag = "openssl-4.0.3" }
variant = "apple"
version = "4.0.3"

[options.no-deprecated]
default = false
type = "bool"

[platforms]
build-on = [ "macos/xcode" ]
supported = [ "ios", "iossim", "macosx", "catalyst", "tvos", "tvossim", "watchos", "watchossim", "xros", "xrossim" ]

[toolchains]
make = { default-recipe = "apotocki/make", version = ">= 3.81" }
perl = { default-recipe = "apotocki/perl", version = ">= 5.30" }
