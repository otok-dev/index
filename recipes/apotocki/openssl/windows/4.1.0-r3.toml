api = 1
description = "OpenSSL (libssl, libcrypto), built from source."
format = 1
keywords = [ "tls", "crypto" ]
library = "openssl"
license = "Apache-2.0"
linkage = [ "static", "dynamic" ]
recipe = "apotocki/openssl"
recipe-sha256 = "da0718164c891b781482d39241a6d15e2314be6ba65ee69e5535c465162f9d67"
recipe-source = { commit = "df3f6c49ed5b9892656e02ec512271d6906ebf3d", git = "https://github.com/otok-dev/recipes.git", path = "recipes/openssl/4.1/windows" }
revision = 3
source = { commit = "2f4e3a5fec05394068cfa7379890ab552483a8a6", git = "https://github.com/openssl/openssl", tag = "openssl-4.1.0" }
variant = "windows"
version = "4.1.0"

[options.no-deprecated]
default = false
type = "bool"

[platforms]
build-on = [ "windows/msvc", "linux/clang-cl" ]
supported = [ "windows" ]

[toolchains]
make = { default-recipe = "apotocki/make", version = ">= 3.81", when = { environment = [ "linux/clang-cl" ] } }
nasm = { default-recipe = "apotocki/nasm", version = ">= 2.09", when = { arch = [ "x86_64" ], environment = [ "windows/msvc" ] } }
perl = { default-recipe = "apotocki/perl", version = ">= 5.30" }
