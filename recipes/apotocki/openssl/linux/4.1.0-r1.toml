api = 1
description = "OpenSSL (libssl, libcrypto), built from source."
format = 1
keywords = [ "tls", "crypto" ]
library = "openssl"
license = "Apache-2.0"
linkage = [ "static", "dynamic" ]
recipe = "apotocki/openssl"
recipe-sha256 = "7e29a3960b5c08a6abd7f5e471a47a9dfef9a1a38ec31c680bd6f06cd4848f52"
recipe-source = { commit = "1ea16409510454b8ee22a4a83ff304e3e03808c4", git = "https://github.com/otok-dev/recipes", path = "recipes/openssl/4.1/linux" }
revision = 1
source = { commit = "2f4e3a5fec05394068cfa7379890ab552483a8a6", git = "https://github.com/openssl/openssl", tag = "openssl-4.1.0" }
variant = "linux"
version = "4.1.0"

[options.no-deprecated]
default = false
type = "bool"

[platforms]
build-on = [ "linux/gcc", "linux/clang" ]
supported = [ "linux" ]

[toolchains]
make = { default-recipe = "apotocki/make", version = ">= 3.81" }
perl = { default-recipe = "apotocki/perl", version = ">= 5.30" }
