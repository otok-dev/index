api = 1
description = "libpng, the reference library for PNG images."
format = 1
keywords = [ "png", "image" ]
library = "libpng"
license = "libpng-2.0"
linkage = [ "static", "dynamic" ]
recipe = "apotocki/libpng"
recipe-sha256 = "e1d079392dee48761735d9f93b77e4fcada2e58ef0ea827ec3ca246f5ab93ef0"
recipe-source = { commit = "2127d964f086bf72facfda16d1f194be8592d123", git = "https://github.com/otok-dev/recipes.git", path = "recipes/libpng/1.6/apple" }
revision = 1
source = { commit = "872555f4ba910252783af1507f9e7fe1653be252", git = "https://github.com/pnggroup/libpng", tag = "v1.6.47" }
variant = "apple"
version = "1.6.47"

[platforms]
build-on = [ "macos/xcode" ]
supported = [ "ios", "iossim", "macosx", "catalyst", "tvos", "tvossim", "watchos", "watchossim", "xros", "xrossim" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
