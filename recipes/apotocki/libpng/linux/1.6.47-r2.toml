api = 1
description = "libpng, the reference library for PNG images."
format = 1
keywords = [ "png", "image" ]
library = "libpng"
license = "libpng-2.0"
linkage = [ "static", "dynamic" ]
recipe = "apotocki/libpng"
recipe-sha256 = "d5e3065e36c3128d17b2de336a8fdf683d9add85e233e067b93de53030406593"
recipe-source = { commit = "df3f6c49ed5b9892656e02ec512271d6906ebf3d", git = "https://github.com/otok-dev/recipes", path = "recipes/libpng/1.6/linux" }
revision = 2
source = { commit = "872555f4ba910252783af1507f9e7fe1653be252", git = "https://github.com/pnggroup/libpng", tag = "v1.6.47" }
variant = "linux"
version = "1.6.47"

[deps.zlib]
default-recipe = "apotocki/zlib"
version = ">= 1.2"

[platforms]
build-on = [ "linux/gcc", "linux/clang" ]
supported = [ "linux" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
