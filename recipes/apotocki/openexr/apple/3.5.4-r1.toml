api = 1
cxx-standard = ">= 17"
description = "OpenEXR, the library of EXR images: high dynamic range, many channels, deep and multi-part images, lossless and lossy compression."
format = 1
keywords = [ "image", "exr", "hdr", "vfx", "codec" ]
library = "openexr"
license = "BSD-3-Clause"
linkage = [ "static", "dynamic" ]
recipe = "apotocki/openexr"
recipe-sha256 = "f8ad6accb5a17ce62d86e131999e65a03dff3218729df4771e3cd5864c29715a"
recipe-source = { commit = "557d9560675a6b5a2fb279c8a8ac19da8e5e4d8b", git = "https://github.com/otok-dev/recipes.git", path = "recipes/openexr/3.5/apple" }
revision = 1
source = { commit = "86687e5f34e3a164820c5e280259550e3ca87c92", git = "https://github.com/AcademySoftwareFoundation/openexr", tag = "v3.5.4" }
variant = "apple"
version = "3.5.4"

[deps.imath]
default-recipe = "apotocki/imath"
version = ">= 3.1"

[deps.libdeflate]
default-recipe = "apotocki/libdeflate"
version = ">= 1.18"

[deps.openjph]
default-recipe = "apotocki/openjph"
version = ">= 0.32"

[deps.zstd]
default-recipe = "apotocki/zstd"
version = ">= 1.5"

[platforms]
build-on = [ "macos/xcode" ]
supported = [ "ios", "iossim", "macosx", "catalyst", "tvos", "tvossim", "watchos", "watchossim", "xros", "xrossim" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
