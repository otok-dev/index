api = 1
cxx-standard = ">= 17"
description = "OpenEXR, the library of EXR images: high dynamic range, many channels, deep and multi-part images, lossless and lossy compression."
format = 1
keywords = [ "image", "exr", "hdr", "vfx", "codec" ]
library = "openexr"
license = "BSD-3-Clause"
linkage = [ "static", "dynamic" ]
recipe = "apotocki/openexr"
recipe-sha256 = "3c767c17f52ab5c65121d54f706e3986b27f63b889a2932f3a19a087525aa07f"
recipe-source = { commit = "e65f43e4659f2d26b7fb873c4a46937b6a2b56d6", git = "https://github.com/otok-dev/recipes", path = "recipes/openexr/3.5/linux" }
revision = 1
source = { commit = "486e238dd28ba6fed22528005b05f9f15bef0cc0", git = "https://github.com/AcademySoftwareFoundation/openexr", tag = "v3.5.5" }
variant = "linux"
version = "3.5.5"

[deps.imath]
default-recipe = "apotocki/imath"
version = ">= 3.1"

[deps.libdeflate]
default-recipe = "apotocki/libdeflate"
version = ">= 1.18"

[deps.openjph]
default-recipe = "apotocki/openjph"
version = ">= 0.32"

[deps.zstd]
default-recipe = "apotocki/zstd"
version = ">= 1.5"

[platforms]
build-on = [ "linux/gcc", "linux/clang" ]
supported = [ "linux" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
