revision = 1
source = { commit = "86687e5f34e3a164820c5e280259550e3ca87c92", git = "https://github.com/AcademySoftwareFoundation/openexr", tag = "v3.5.4" }
variant = "android"
version = "3.5.4"

[deps.imath]
default-recipe = "apotocki/imath"
version = ">= 3.1"

[deps.libdeflate]
default-recipe = "apotocki/libdeflate"
