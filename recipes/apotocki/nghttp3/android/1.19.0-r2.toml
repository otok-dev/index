revision = 2
source = { sha256 = "228e17f5cc3d4de7bfced9912bd09de30e7f45741cc47503cf88d3fa9209e155", url = "https://github.com/ngtcp2/nghttp3/releases/download/v1.19.0/nghttp3-1.19.0.tar.xz" }
