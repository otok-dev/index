api = 1
cxx-standard = ">= 17"
description = "OpenCV, the library of computer vision: image processing, codecs, features, calibration, video analysis, DNN inference."
format = 1
keywords = [ "computer-vision", "image", "image-processing", "video", "dnn", "opencv" ]
library = "opencv"
license = "Apache-2.0 AND BSD-3-Clause AND MIT AND MIT-Modern-Variant AND OFL-1.1"
linkage = [ "static", "dynamic" ]
published = 2026-11-20T22:31:42Z
recipe = "apotocki/opencv"
recipe-sha256 = "ed622630c89b94d6526f961ad236337b84706e487aa96756f9c6420fad89514b"
recipe-source = { commit = "542ec462bddc05e373471fcdc564fd2a8a3b591e", git = "https://github.com/otok-dev/recipes.git", path = "recipes/opencv/5.1/windows" }
revision = 5
source = { commit = "e4f78fbcf1a773fbed69e14500e8b734963eb585", git = "https://github.com/opencv/opencv", tag = "5.1.0" }
variant = "windows"
version = "5.1.0"

[deps.abseil]
default-recipe = "apotocki/abseil"
linkage = "static"
version = ">= 20260000"
when = { has = "dnn", option = "modules" }

[deps.brotli]
default-recipe = "apotocki/brotli"
version = ">= 1.0"
when = { has = "jpegxl", option = "codecs" }

[deps.dav1d]
default-recipe = "apotocki/dav1d"
version = ">= 1.0"
when = { has = "avif", option = "codecs" }

[deps.ffmpeg]
default-recipe = "apotocki/ffmpeg"
version = ">= 6.0"
when = { option = "ffmpeg" }

[deps.highway]
default-recipe = "apotocki/highway"
version = ">= 1.0.7"
when = { has = "jpegxl", option = "codecs" }

[deps.imath]
default-recipe = "apotocki/imath"
version = ">= 3.1"
when = { has = "openexr", option = "codecs" }

[deps.libavif]
default-recipe = "apotocki/libavif"
version = ">= 1.0"
when = { has = "avif", option = "codecs" }

[deps.libdeflate]
default-recipe = "apotocki/libdeflate"
version = ">= 1.18"
when = { has = "openexr", option = "codecs" }

[deps.libjpeg-turbo]
default-recipe = "apotocki/libjpeg-turbo"
requires-options = { api = "libjpeg" }
version = ">= 3.0"
when = { has = "jpeg", option = "codecs" }

[deps.libjxl]
default-recipe = "apotocki/libjxl"
version = ">= 0.10"
when = { has = "jpegxl", option = "codecs" }

[deps.libpng]
default-recipe = "apotocki/libpng"
version = ">= 1.6"
when = { has = "png", option = "codecs" }

[deps.libtiff]
default-recipe = "apotocki/libtiff"
version = ">= 4.0"
when = { has = "tiff", option = "codecs" }

[deps.libwebp]
default-recipe = "apotocki/libwebp"
version = ">= 1.0"
when = { has = "webp", option = "codecs" }

[deps.openexr]
default-recipe = "apotocki/openexr"
version = ">= 3.0"
when = { has = "openexr", option = "codecs" }

[deps.openjpeg]
default-recipe = "apotocki/openjpeg"
version = ">= 2.3"
when = { has = "jpeg2000", option = "codecs" }

[deps.openjph]
default-recipe = "apotocki/openjph"
version = ">= 0.32"
when = { has = "openexr", option = "codecs" }

[deps.protobuf]
default-recipe = "apotocki/protobuf"
linkage = "static"
requires-options = { runtime = "full" }
toolchains = [ "protoc" ]
version = ">= 30"
when = { has = "dnn", option = "modules" }

[deps.zlib]
default-recipe = "apotocki/zlib"
version = ">= 1.2"

[deps.zstd]
default-recipe = "apotocki/zstd"
version = ">= 1.5"
when = { has = "openexr", option = "codecs" }

[options.codecs]
additive = true
default = [ "jpeg", "png" ]
doc = "The image formats of imgcodecs that need a library, each from its recipe: avif (libavif with dav1d: reading AVIF), jpeg (libjpeg-turbo), jpeg2000 (OpenJPEG: JPEG 2000 and HTJ2K), jpegxl (libjxl: JPEG XL), openexr (OpenEXR: EXR), png (libpng), tiff (libtiff), webp (libwebp). BMP, GIF, PNM/PAM, PFM, Sun Raster and Radiance HDR are always there."
type = "list"
values = [ "avif", "jpeg", "jpeg2000", "jpegxl", "openexr", "png", "tiff", "webp" ]

[options.ffmpeg]
default = false
doc = "FFmpeg (its recipe) as a backend of videoio, which needs videoio in modules: reading and writing the video files and streams FFmpeg knows. A dynamic opencv needs a dynamic ffmpeg. FFmpeg's recipe builds for x86_64 only."
type = "bool"

[options.modules]
additive = true
default = [ "imgcodecs", "imgproc" ]
doc = "The modules in opencv_world besides core, with the modules they need (imgproc needs geometry and flann): calib, dnn, features, flann, geometry, imgcodecs, imgproc, objdetect, photo, stereo, stitching, video, videoio (Media Foundation and DirectShow)."
type = "list"
values = [
"calib",
"dnn",
"features",
"flann",
"geometry",
"imgcodecs",
"imgproc",
"objdetect",
"photo",
"stereo",
"stitching",
"video",
"videoio"
]

[platforms]
build-on = [ "windows/msvc", "linux/clang-cl" ]
supported = [ "windows" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
