api = 1
cxx-standard = ">= 17"
description = "OpenCV, the library of computer vision: image processing, codecs, features, calibration, video analysis, DNN inference."
format = 1
keywords = [ "computer-vision", "image", "image-processing", "video", "dnn", "opencv" ]
library = "opencv"
license = "Apache-2.0 AND BSD-3-Clause AND MIT AND MIT-Modern-Variant AND OFL-1.1"
linkage = [ "static", "dynamic" ]
published = 2026-11-20T21:41:32Z
recipe = "apotocki/opencv"
recipe-sha256 = "4fed144364b16b1e1d92748c8e7f19a04a1c46272855d13c69e10e6167bcc4b0"
recipe-source = { commit = "ae45d4fea72061898d6376debb343d699a1a30e2", git = "https://github.com/otok-dev/recipes.git", path = "recipes/opencv/5.1/apple" }
revision = 4
source = { commit = "e4f78fbcf1a773fbed69e14500e8b734963eb585", git = "https://github.com/opencv/opencv", tag = "5.1.0" }
variant = "apple"
version = "5.1.0"

[deps.abseil]
default-recipe = "apotocki/abseil"
linkage = "static"
version = ">= 20260000"
when = { has = "dnn", option = "modules" }

[deps.brotli]
default-recipe = "apotocki/brotli"
version = ">= 1.0"
when = { has = "jpegxl", option = "codecs" }

[deps.dav1d]
default-recipe = "apotocki/dav1d"
version = ">= 1.0"
when = { has = "avif", option = "codecs" }

[deps.ffmpeg]
default-recipe = "apotocki/ffmpeg"
version = ">= 6.0"
when = { not = { platform = [ "watchos", "watchossim" ] }, option = "ffmpeg" }

[deps.highway]
default-recipe = "apotocki/highway"
version = ">= 1.0.7"
when = { has = "jpegxl", option = "codecs" }

[deps.libavif]
default-recipe = "apotocki/libavif"
version = ">= 1.0"
when = { has = "avif", option = "codecs" }

[deps.libjpeg-turbo]
default-recipe = "apotocki/libjpeg-turbo"
requires-options = { api = "libjpeg" }
version = ">= 3.0"
when = { has = "jpeg", option = "codecs" }

[deps.libjxl]
default-recipe = "apotocki/libjxl"
version = ">= 0.10"
when = { has = "jpegxl", option = "codecs" }

[deps.libpng]
default-recipe = "apotocki/libpng"
version = ">= 1.6"
when = { has = "png", option = "codecs" }

[deps.libtiff]
default-recipe = "apotocki/libtiff"
version = ">= 4.0"
when = { has = "tiff", option = "codecs" }

[deps.libwebp]
default-recipe = "apotocki/libwebp"
version = ">= 1.0"
when = { has = "webp", option = "codecs" }

[deps.openjpeg]
default-recipe = "apotocki/openjpeg"
version = ">= 2.3"
when = { has = "jpeg2000", option = "codecs" }

[deps.protobuf]
default-recipe = "apotocki/protobuf"
linkage = "static"
requires-options = { runtime = "full" }
toolchains = [ "protoc" ]
version = ">= 30"
when = { has = "dnn", option = "modules" }

[options.codecs]
additive = true
default = [ "jpeg", "png" ]
doc = "The image formats of imgcodecs that need a library, each from its recipe: avif (libavif with dav1d: reading AVIF), jpeg (libjpeg-turbo), jpeg2000 (OpenJPEG: JPEG 2000 and HTJ2K), jpegxl (libjxl: JPEG XL), png (libpng), tiff (libtiff), webp (libwebp). BMP, GIF, PNM/PAM, PFM, Sun Raster and Radiance HDR are always there."
type = "list"
values = [ "avif", "jpeg", "jpeg2000", "jpegxl", "png", "tiff", "webp" ]

[options.ffmpeg]
default = false
doc = "FFmpeg (its recipe) as a backend of videoio, which needs videoio in modules: reading and writing the video files and streams FFmpeg knows. A dynamic opencv needs a dynamic ffmpeg. Not on watchOS, which FFmpeg's recipe does not build for (the option does nothing there)."
type = "bool"

[options.modules]
additive = true
default = [ "imgcodecs", "imgproc" ]
doc = "The modules in opencv_world besides core, with the modules they need (imgproc needs geometry and flann): calib, dnn, features, flann, geometry, imgcodecs, imgproc, objdetect, photo, stereo, stitching, video, videoio (AVFoundation on macOS, iOS and Mac Catalyst; elsewhere OpenCV's own MJPEG files only)."
type = "list"
values = [
"calib",
"dnn",
"features",
"flann",
"geometry",
"imgcodecs",
"imgproc",
"objdetect",
"photo",
"stereo",
"stitching",
"video",
"videoio"
]

[platforms]
build-on = [ "macos/xcode" ]
supported = [ "ios", "iossim", "macosx", "catalyst", "tvos", "tvossim", "watchos", "watchossim", "xros", "xrossim" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }

[[resource]]
commit = "cacea38588eb35de69075a0a1a876b82bfcd88dd"
git = "https://gitlab.arm.com/kleidi/kleidicv.git"
name = "kleidicv"
tag = "26.09"
