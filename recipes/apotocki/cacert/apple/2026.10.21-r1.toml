api = 1
description = "The root certificates of Mozilla's CA Certificate Program, as a PEM bundle."
format = 1
keywords = [ "certificates", "ca", "tls" ]
library = "cacert"
license = "MPL-2.0"
linkage = [ "static", "dynamic" ]
recipe = "apotocki/cacert"
recipe-sha256 = "3d0352640b4b9b1d5e6d55541a47e700947a75a6e8d894b0d41fcdeb28140427"
recipe-source = { commit = "df3f6c49ed5b9892656e02ec512271d6906ebf3d", git = "https://github.com/otok-dev/recipes.git", path = "recipes/cacert/2026/apple" }
revision = 1
source = { sha256 = "8dadd7d2536a314f982ad05a651b713f426bf7d02cc2c76cffb9796f2218e6c5", url = "https://curl.se/download/curl-8.23.0.tar.xz" }
variant = "apple"
version = "2026.10.21"

[options.data]
default = "static"
type = "enum"
values = [ "static", "file" ]

[platforms]
build-on = [ "macos/xcode" ]
supported = [ "ios", "iossim", "macosx", "catalyst", "tvos", "tvossim", "watchos", "watchossim", "xros", "xrossim" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
perl = { default-recipe = "apotocki/perl", version = ">= 5.30" }

[[resource]]
name = "certdata"
sha256 = "3ec2b4d240dc12c747eaf450061db84af757c483bbda302f9e29ceb5d70be510"
url = "https://raw.githubusercontent.com/mozilla-firefox/firefox/7ff62457dcf126523608e2f4b90d232d49d58185/security/nss/lib/ckfw/builtins/certdata.txt"
