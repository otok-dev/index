api = 1
description = "pkgconf, the pkg-config program: compiler and linker flags of libraries from their .pc files."
format = 1
keywords = [ "build", "tool" ]
library = "pkg-config"
license = "ISC"
recipe = "apotocki/pkgconf"
recipe-sha256 = "8cb356a9d76c90ce2c1fcdc937a57d0ad921f7993c4a88ae87dfdbe16e9b7c57"
recipe-source = { commit = "32756a87cf5bd189ca4c9825159bf0713ea8cf5e", git = "https://github.com/otok-dev/recipes.git", path = "recipes/pkgconf/3.0/windows" }
revision = 1
source = { sha256 = "9371b2f6372da574d4c6dc96fe9b1463037bcf6afcb6671c1555afde7b17e2de", url = "https://distfiles.ariadne.space/pkgconf/pkgconf-3.0.10.tar.xz" }
