api = 1
description = "pkgconf, the pkg-config program: compiler and linker flags of libraries from their .pc files."
format = 1
keywords = [ "build", "tool" ]
library = "pkg-config"
license = "ISC"
recipe = "apotocki/pkgconf"
recipe-sha256 = "f69483dcb926550ae9c67b1284418c7f868957c091ad6bdb3293812c32ee529f"
recipe-source = { commit = "df3f6c49ed5b9892656e02ec512271d6906ebf3d", git = "https://github.com/otok-dev/recipes", path = "recipes/pkgconf/3.0/linux" }
revision = 2
source = { sha256 = "9371b2f6372da574d4c6dc96fe9b1463037bcf6afcb6671c1555afde7b17e2de", url = "https://distfiles.ariadne.space/pkgconf/pkgconf-3.0.10.tar.xz" }
variant = "linux"
version = "3.0.10"

[platforms]
build-on = [ "linux/gcc", "linux/clang" ]
supported = [ "linux" ]

[tool]
programs = [ "pkg-config" ]

[toolchains]
meson = { default-recipe = "apotocki/meson", version = ">= 0.47" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
