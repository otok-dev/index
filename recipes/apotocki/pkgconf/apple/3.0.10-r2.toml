api = 1
description = "pkgconf, the pkg-config program: compiler and linker flags of libraries from their .pc files."
format = 1
keywords = [ "build", "tool" ]
library = "pkg-config"
license = "ISC"
recipe = "apotocki/pkgconf"
recipe-sha256 = "db181fb011b92265eab047af78b9bece759f06c8eb878830b5c6d905b62a0341"
recipe-source = { commit = "df3f6c49ed5b9892656e02ec512271d6906ebf3d", git = "https://github.com/otok-dev/recipes.git", path = "recipes/pkgconf/3.0/apple" }
revision = 2
source = { sha256 = "9371b2f6372da574d4c6dc96fe9b1463037bcf6afcb6671c1555afde7b17e2de", url = "https://distfiles.ariadne.space/pkgconf/pkgconf-3.0.10.tar.xz" }
variant = "apple"
version = "3.0.10"

[platforms]
build-on = [ "macos/xcode" ]
supported = [ "macosx" ]

[tool]
programs = [ "pkg-config" ]

[toolchains]
