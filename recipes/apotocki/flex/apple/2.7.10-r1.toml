revision = 1
source = { sha256 = "d303c2956792acd8bf3601effef76cadc85a7876852cb66da411c0d5d2f868f4", url = "https://github.com/westes/flex/releases/download/v2.7.10/flex-2.7.10.tar.gz" }
variant = "apple"
