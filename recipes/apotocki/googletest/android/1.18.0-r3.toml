api = 1
cxx-standard = ">= 17"
description = "GoogleTest and GoogleMock, Google's C++ test framework."
format = 1
keywords = [ "testing", "gtest", "gmock" ]
library = "googletest"
license = "BSD-3-Clause"
linkage = [ "static" ]
recipe = "apotocki/googletest"
recipe-sha256 = "1887fdb449c7c0aaa04d549fb92f6e8c31dbb44a447a58eccf448bc408d65d69"
recipe-source = { commit = "df3f6c49ed5b9892656e02ec512271d6906ebf3d", git = "https://github.com/otok-dev/recipes.git", path = "recipes/googletest/1.18/android" }
revision = 3
source = { commit = "063de7e9578f82b369302001269680b4b1553359", git = "https://github.com/google/googletest", tag = "v1.18.0" }
variant = "android"
version = "1.18.0"

[platforms]
build-on = [ "*/ndk" ]
supported = [ "android" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
