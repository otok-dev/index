format = 1
keywords = [ "testing", "gtest", "gmock" ]
library = "googletest"
license = "BSD-3-Clause"
linkage = [ "static" ]
recipe = "apotocki/googletest"
recipe-sha256 = "53f85e2a0533372dc3d812c2ada6a15c196212f085011534fb4dcfe269988142"
