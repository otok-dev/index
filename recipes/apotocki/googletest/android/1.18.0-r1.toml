api = 1
cxx-standard = ">= 17"
description = "GoogleTest and GoogleMock, Google's C++ test framework."
format = 1
keywords = [ "testing", "gtest", "gmock" ]
library = "googletest"
license = "BSD-3-Clause"
linkage = [ "static" ]
recipe = "apotocki/googletest"
recipe-sha256 = "bdc7d0b76c529a9d58cc09f6b6dc9a3bae5fe64a1f22827e21b34fab1645f26d"
recipe-source = { commit = "32756a87cf5bd189ca4c9825159bf0713ea8cf5e", git = "https://github.com/otok-dev/recipes.git", path = "recipes/googletest/1.18/android" }
revision = 1
source = { commit = "063de7e9578f82b369302001269680b4b1553359", git = "https://github.com/google/googletest", tag = "v1.18.0" }
variant = "android"
version = "1.18.0"

[platforms]
build-on = [ "*/ndk" ]
supported = [ "android" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
