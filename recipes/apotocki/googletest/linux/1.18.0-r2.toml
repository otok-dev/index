api = 1
cxx-standard = ">= 17"
description = "GoogleTest and GoogleMock, Google's C++ test framework."
format = 1
keywords = [ "testing", "gtest", "gmock" ]
library = "googletest"
license = "BSD-3-Clause"
linkage = [ "static" ]
recipe = "apotocki/googletest"
recipe-sha256 = "b6e76da7eb0bc57396a5e4193cb48066c0ef023c7ee2bc0ea3ec25054590cc63"
recipe-source = { commit = "df3f6c49ed5b9892656e02ec512271d6906ebf3d", git = "https://github.com/otok-dev/recipes", path = "recipes/googletest/1.18/linux" }
revision = 2
source = { commit = "063de7e9578f82b369302001269680b4b1553359", git = "https://github.com/google/googletest", tag = "v1.18.0" }
variant = "linux"
version = "1.18.0"

[platforms]
build-on = [ "linux/gcc", "linux/clang" ]
supported = [ "linux" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
