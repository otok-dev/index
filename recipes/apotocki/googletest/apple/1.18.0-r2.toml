api = 1
cxx-standard = ">= 17"
description = "GoogleTest and GoogleMock, Google's C++ test framework."
format = 1
keywords = [ "testing", "gtest", "gmock" ]
library = "googletest"
license = "BSD-3-Clause"
linkage = [ "static" ]
recipe = "apotocki/googletest"
recipe-sha256 = "64f46c9e5a934d049d2f8b9b4ac1236d79e986faaa372254c0089e9255fa97e8"
recipe-source = { commit = "df3f6c49ed5b9892656e02ec512271d6906ebf3d", git = "https://github.com/otok-dev/recipes.git", path = "recipes/googletest/1.18/apple" }
revision = 2
source = { commit = "063de7e9578f82b369302001269680b4b1553359", git = "https://github.com/google/googletest", tag = "v1.18.0" }
variant = "apple"
version = "1.18.0"

[platforms]
build-on = [ "macos/xcode" ]
supported = [ "ios", "iossim", "macosx", "catalyst", "tvos", "tvossim", "watchos", "watchossim", "xros", "xrossim" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
