api = 1
cxx-standard = ">= 17"
description = "LunaSVG, an SVG rendering library in C++."
format = 1
keywords = [ "svg", "graphics", "rendering" ]
library = "lunasvg"
license = "MIT"
linkage = [ "static", "dynamic" ]
recipe = "apotocki/lunasvg"
recipe-sha256 = "3b1d33cb8268eb883819e9520d064f00be9caf7d42ea26a6475ca3dcd78c4888"
recipe-source = { commit = "df3f6c49ed5b9892656e02ec512271d6906ebf3d", git = "https://github.com/otok-dev/recipes", path = "recipes/lunasvg/3.5/linux" }
revision = 2
source = { commit = "83c58df8103dc7dca423dfd824992af94d49bed6", git = "https://github.com/sammycage/lunasvg", tag = "v3.5.0" }
variant = "linux"
version = "3.5.0"

[deps.plutovg]
default-recipe = "apotocki/plutovg"
version = ">= 1.3"

[platforms]
build-on = [ "linux/gcc", "linux/clang" ]
supported = [ "linux" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
