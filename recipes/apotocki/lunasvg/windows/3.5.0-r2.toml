api = 1
cxx-standard = ">= 17"
description = "LunaSVG, an SVG rendering library in C++."
format = 1
keywords = [ "svg", "graphics", "rendering" ]
library = "lunasvg"
license = "MIT"
linkage = [ "static", "dynamic" ]
recipe = "apotocki/lunasvg"
recipe-sha256 = "0e51ccb9a74ddc182d4ca8406998399def941b9615926ff1bbb0e9962d135d77"
recipe-source = { commit = "51bcfe2aa8cfb530304ac3db16156d6a875d23f6", git = "https://github.com/otok-dev/recipes.git", path = "recipes/lunasvg/3.5/windows" }
revision = 2
source = { commit = "83c58df8103dc7dca423dfd824992af94d49bed6", git = "https://github.com/sammycage/lunasvg", tag = "v3.5.0" }
variant = "windows"
version = "3.5.0"

[deps.plutovg]
default-recipe = "apotocki/plutovg"
