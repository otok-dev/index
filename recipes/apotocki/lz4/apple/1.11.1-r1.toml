api = 1
description = "LZ4, an extremely fast lossless compression library."
format = 1
keywords = [ "compression", "lz4" ]
library = "lz4"
license = "BSD-2-Clause"
linkage = [ "static" ]
recipe = "apotocki/lz4"
recipe-sha256 = "12707d926fcbacad985488ed0decf46bf50fae342723b3b28a28dfa6f06116f6"
recipe-source = { commit = "7387b6ee8dee98c91c576f3e39051559e5e83d83", git = "https://github.com/otok-dev/recipes.git", path = "recipes/lz4/1.11/apple" }
revision = 1
source = { commit = "aa4647fad575d01a874aaaadcdbe8e6a40e072f5", git = "https://github.com/lz4/lz4", tag = "v1.11.1" }
variant = "apple"
version = "1.11.1"

[platforms]
build-on = [ "macos/xcode" ]
supported = [ "ios", "iossim", "macosx", "catalyst", "tvos", "tvossim", "watchos", "watchossim", "xros", "xrossim" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
