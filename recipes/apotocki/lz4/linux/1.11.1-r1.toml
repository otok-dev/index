api = 1
description = "LZ4, an extremely fast lossless compression library."
format = 1
keywords = [ "compression", "lz4" ]
library = "lz4"
license = "BSD-2-Clause"
linkage = [ "static", "dynamic" ]
recipe = "apotocki/lz4"
