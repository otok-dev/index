api = 1
description = "LZ4, an extremely fast lossless compression library."
format = 1
keywords = [ "compression", "lz4" ]
library = "lz4"
license = "BSD-2-Clause"
linkage = [ "static", "dynamic" ]
recipe = "apotocki/lz4"
recipe-sha256 = "5fcd3a8aaf6b96c00b8c1c6a76e06eb6a6b4f73d9e480a6f302d6c38f950c71d"
recipe-source = { commit = "32756a87cf5bd189ca4c9825159bf0713ea8cf5e", git = "https://github.com/otok-dev/recipes", path = "recipes/lz4/1.10/linux" }
revision = 1
source = { commit = "ebb370ca83af193212df4dcbadcc5d87bc0de2f0", git = "https://github.com/lz4/lz4", tag = "v1.10.0" }
variant = "linux"
version = "1.10.0"

[platforms]
build-on = [ "linux/gcc", "linux/clang" ]
supported = [ "linux" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
