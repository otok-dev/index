api = 1
cxx-standard = ">= 17"
description = "inja, a template engine for modern C++ in the spirit of Jinja2, over nlohmann/json: loops, conditions, includes, inheritance and callbacks."
format = 1
keywords = [ "template", "template-engine", "jinja", "json", "cpp", "header-only" ]
library = "inja"
license = "MIT"
recipe = "apotocki/inja"
recipe-sha256 = "08b4cc1b54b65b906d8b210f9d63bf46126817fe65e668dbf5a367b859dc690c"
recipe-source = { commit = "1ea16409510454b8ee22a4a83ff304e3e03808c4", git = "https://github.com/otok-dev/recipes", path = "recipes/inja/3.5/linux" }
revision = 1
source = { commit = "7d1b4600b68595085a949743331c2e5673f511ea", git = "https://github.com/pantor/inja", tag = "v3.5.0" }
variant = "linux"
version = "3.5.0"

[deps.nlohmann-json]
default-recipe = "apotocki/nlohmann-json"
version = ">= 3.11"

[platforms]
build-on = [ "linux/gcc", "linux/clang" ]
supported = [ "linux" ]
