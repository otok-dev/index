api = 1
cxx-standard = ">= 17"
description = "inja, a template engine for modern C++ in the spirit of Jinja2, over nlohmann/json: loops, conditions, includes, inheritance and callbacks."
format = 1
keywords = [ "template", "template-engine", "jinja", "json", "cpp", "header-only" ]
library = "inja"
license = "MIT"
recipe = "apotocki/inja"
recipe-sha256 = "5486c8a9ab62571d6f649f38d879de5333f2a7778d9a3960a138aa0f02266287"
recipe-source = { commit = "1ea16409510454b8ee22a4a83ff304e3e03808c4", git = "https://github.com/otok-dev/recipes.git", path = "recipes/inja/3.5/apple" }
revision = 1
source = { commit = "7d1b4600b68595085a949743331c2e5673f511ea", git = "https://github.com/pantor/inja", tag = "v3.5.0" }
variant = "apple"
version = "3.5.0"

[deps.nlohmann-json]
default-recipe = "apotocki/nlohmann-json"
version = ">= 3.11"

[platforms]
build-on = [ "macos/xcode" ]
supported = [ "ios", "iossim", "macosx", "catalyst", "tvos", "tvossim", "watchos", "watchossim", "xros", "xrossim" ]
