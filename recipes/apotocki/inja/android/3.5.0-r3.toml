api = 1
cxx-standard = ">= 17"
description = "inja, a template engine for modern C++ in the spirit of Jinja2, over nlohmann/json: loops, conditions, includes, inheritance and callbacks."
format = 1
keywords = [ "template", "template-engine", "jinja", "json", "cpp", "header-only" ]
library = "inja"
license = "MIT"
recipe = "apotocki/inja"
recipe-sha256 = "db4d698e9b94f1f64f5418ff49ae3ba5322b2d6c77102c4498334dcd0887573d"
recipe-source = { commit = "df3f6c49ed5b9892656e02ec512271d6906ebf3d", git = "https://github.com/otok-dev/recipes.git", path = "recipes/inja/3.5/android" }
revision = 3
source = { commit = "7d1b4600b68595085a949743331c2e5673f511ea", git = "https://github.com/pantor/inja", tag = "v3.5.0" }
variant = "android"
version = "3.5.0"

[deps.nlohmann-json]
default-recipe = "apotocki/nlohmann-json"
version = ">= 3.11"

[platforms]
build-on = [ "*/ndk" ]
supported = [ "android" ]
