revision = 1
source = { commit = "41158a44ab3fb7ac5df7f99ef82626c87607447f", git = "https://github.com/uxlfoundation/oneTBB", tag = "v2023.2.0" }
variant = "android"
version = "2023.2.0"

[platforms]
build-on = [ "*/ndk" ]
supported = [ "android" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
