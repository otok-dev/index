api = 1
description = "oneTBB, a C++ library of parallel algorithms, concurrent containers and a work-stealing task scheduler, with the scalable allocator tbbmalloc."
format = 1
keywords = [ "parallel", "threading", "tasks", "concurrency", "allocator" ]
library = "onetbb"
license = "Apache-2.0"
linkage = [ "static", "dynamic" ]
recipe = "apotocki/onetbb"
recipe-sha256 = "f10f36ffb9d4e214ebe90b12eea659907cc3c6b7e400619e6173786b0066c253"
recipe-source = { commit = "4409a7dc91fbbe0e5e9f9d8b396597c6bacf78ee", git = "https://github.com/otok-dev/recipes", path = "recipes/onetbb/2023/linux" }
revision = 1
source = { commit = "41158a44ab3fb7ac5df7f99ef82626c87607447f", git = "https://github.com/uxlfoundation/oneTBB", tag = "v2023.2.0" }
variant = "linux"
version = "2023.2.0"

[platforms]
build-on = [ "linux/gcc", "linux/clang" ]
supported = [ "linux" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
