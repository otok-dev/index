api = 1
description = "HarfBuzz, the text shaping engine: Unicode text and an OpenType font in, positioned glyphs out; and its font subsetter."
format = 1
keywords = [ "text", "shaping", "font", "opentype", "unicode" ]
library = "harfbuzz"
license = "MIT-Modern-Variant AND MIT"
linkage = [ "static", "dynamic" ]
recipe = "apotocki/harfbuzz"
recipe-sha256 = "c7063731c5d349eec3eb936956002206ee6509916629ff95850ccaf53c5dabef"
recipe-source = { commit = "60c2d996020bfafff1a3e5abb1858413a5337084", git = "https://github.com/otok-dev/recipes", path = "recipes/harfbuzz/15.2/apple" }
revision = 2
source = { commit = "ed51d202cfd0c29372d3ee056eb0dc715688a410", git = "https://github.com/harfbuzz/harfbuzz.git", tag = "15.2.0" }
variant = "apple"
version = "15.2.0"

[options.coretext]
additive = true
default = false
doc = "The CoreText shaper and font functions, and hb-coretext.h."
type = "bool"

[options.raster]
additive = true
default = false
doc = "libharfbuzz-raster and hb-raster.h, HarfBuzz's rasterizer of glyphs into 8-bit masks (hb_raster_draw_*), which OpenCV's putText draws with."
type = "bool"

[platforms]
build-on = [ "macos/xcode" ]
supported = [ "ios", "iossim", "macosx", "catalyst", "tvos", "tvossim", "watchos", "watchossim", "xros", "xrossim" ]

[toolchains]
meson = { default-recipe = "apotocki/meson", version = ">= 1.2" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
