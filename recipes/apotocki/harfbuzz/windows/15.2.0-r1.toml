api = 1
description = "HarfBuzz, the text shaping engine: Unicode text and an OpenType font in, positioned glyphs out; and its font subsetter."
format = 1
keywords = [ "text", "shaping", "font", "opentype", "unicode" ]
library = "harfbuzz"
license = "MIT-Modern-Variant AND MIT"
linkage = [ "static", "dynamic" ]
recipe = "apotocki/harfbuzz"
recipe-sha256 = "870bfe04e7e871d920f23bfc40d06c25ca6de8e5a40556cc9f2def6249ed0f45"
recipe-source = { commit = "e68d988f05d6151be14e7a9003ac1ee2aee577b9", git = "https://github.com/otok-dev/recipes", path = "recipes/harfbuzz/15.2/windows" }
revision = 1
source = { commit = "ed51d202cfd0c29372d3ee056eb0dc715688a410", git = "https://github.com/harfbuzz/harfbuzz.git", tag = "15.2.0" }
variant = "windows"
version = "15.2.0"

[deps.freetype]
default-recipe = "apotocki/freetype"
version = ">= 2.10"
when = { option = "freetype" }

[options.directwrite]
additive = true
default = false
doc = "The DirectWrite shaper and font functions, and hb-directwrite.h."
type = "bool"

[options.freetype]
additive = true
default = false
doc = "FreeType's font functions and hb-ft.h (hb_ft_font_create), with freetype."
type = "bool"

[options.gdi]
additive = true
default = false
doc = "The GDI helpers and the Uniscribe shaper, and hb-gdi.h and hb-uniscribe.h."
type = "bool"

[platforms]
build-on = [ "windows/msvc", "linux/clang-cl" ]
supported = [ "windows" ]

[toolchains]
meson = { default-recipe = "apotocki/meson", version = ">= 1.2" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
pkg-config = { default-recipe = "apotocki/pkgconf", version = ">= 1", when = { option = "freetype" } }
