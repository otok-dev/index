api = 1
description = "Mbed TLS, a small, portable implementation of TLS, DTLS, X.509 and the PSA Cryptography API."
format = 1
keywords = [ "tls", "ssl", "x509", "crypto", "cryptography", "psa" ]
library = "mbedtls"
license = "Apache-2.0 OR GPL-2.0-or-later"
linkage = [ "static", "dynamic" ]
recipe = "apotocki/mbedtls"
recipe-sha256 = "a92a03802546b75832301206236cda3990567e854e732cc0cbbc1e7657e2a75f"
recipe-source = { commit = "df3f6c49ed5b9892656e02ec512271d6906ebf3d", git = "https://github.com/otok-dev/recipes", path = "recipes/mbedtls/4.2/linux" }
revision = 2
source = { sha256 = "2bed9d713b4668f76553b097e72b8aa30bc8f112a940d7ae228d524bbde6ffea", url = "https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-4.2.0/mbedtls-4.2.0.tar.bz2" }
variant = "linux"
version = "4.2.0"

[platforms]
build-on = [ "linux/gcc", "linux/clang" ]
supported = [ "linux" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
