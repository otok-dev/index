api = 1
description = "Brotli, a generic-purpose lossless compression algorithm (encoder, decoder and the common dictionary)."
format = 1
keywords = [ "compression", "brotli" ]
library = "brotli"
license = "MIT"
linkage = [ "static", "dynamic" ]
recipe = "apotocki/brotli"
recipe-sha256 = "b563b85910f6495c5b7cef1660341a71b4367e3daf37c8a4ceb66d6d7f2205e0"
recipe-source = { commit = "df3f6c49ed5b9892656e02ec512271d6906ebf3d", git = "https://github.com/otok-dev/recipes", path = "recipes/brotli/1.2/linux" }
revision = 1
source = { commit = "db24a98aed38a16de78cc05ca15cdd8dc2a0d92d", git = "https://github.com/google/brotli", tag = "v1.2.1" }
variant = "linux"
version = "1.2.1"

[platforms]
build-on = [ "linux/gcc", "linux/clang" ]
supported = [ "linux" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
