api = 1
cxx-standard = ">= 23"
description = "otok, the dependency manager that builds native libraries from source, built by otok."
format = 1
keywords = [ "package-manager", "build", "dependencies" ]
library = "otok"
license = "GPL-3.0-only WITH AdditionRef-otok-output-exception"
published = 2026-11-27T22:43:58Z
recipe = "apotocki/otok"
recipe-sha256 = "6980303906266ae533da46f287c32e09f3df4de111e9679a840956519a279f6f"
recipe-source = { commit = "86ee5cde72cec4eff141976564e5514d3781b8b8", git = "https://github.com/otok-dev/recipes", path = "recipes/otok/0.6/linux" }
revision = 1
source = { sha256 = "461b530fb012a35217d39ba977cc323b808c8141e6d95c091ecfb07e2da66091", url = "https://github.com/otok-dev/otok/releases/download/v0.6.9/otok-0.6.9.tar.gz" }
variant = "linux"
version = "0.6.9"

[deps.bzip2]
default-recipe = "apotocki/bzip2"
version = ">= 1.0"

[deps.curl]
default-recipe = "apotocki/curl"
version = ">= 8.0"

[deps.inja]
default-recipe = "apotocki/inja"
version = ">= 3.4"

[deps.libacl]
default-recipe = "apotocki/libacl"
version = ">= 2.3"

[deps.libarchive]
default-recipe = "apotocki/libarchive"
requires-options = { bzip2 = true, lzma = true, zlib = true, zstd = true }
version = ">= 3.7"

[deps.libxml2]
default-recipe = "apotocki/libxml2"
version = ">= 2.9"

[deps.lz4]
default-recipe = "apotocki/lz4"
version = ">= 1.7"

[deps.lzma]
default-recipe = "apotocki/lzma"
version = ">= 5.0"

[deps.mbedtls]
default-recipe = "apotocki/mbedtls"
version = ">= 4.0"

[deps.nlohmann-json]
default-recipe = "apotocki/nlohmann-json"
version = ">= 3.11"

[deps.openssl]
default-recipe = "apotocki/openssl"
version = ">= 3.0"

[deps.tomlplusplus]
default-recipe = "apotocki/tomlplusplus"
requires-options = { compiled = true }
version = ">= 3.4"

[deps.zlib]
default-recipe = "apotocki/zlib"
version = ">= 1.2"

[deps.zstd]
default-recipe = "apotocki/zstd"
version = ">= 1.4"

[platforms]
build-on = [ "linux/gcc", "linux/clang" ]
supported = [ "linux" ]

[tool]
programs = [ "otok" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.25" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
