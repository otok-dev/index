api = 1
cxx-standard = ">= 23"
description = "otok, the dependency manager that builds native libraries from source, built by otok."
format = 1
keywords = [ "package-manager", "build", "dependencies" ]
library = "otok"
license = "GPL-3.0-only WITH AdditionRef-otok-output-exception"
published = 2026-11-27T18:02:43Z
recipe = "apotocki/otok"
recipe-sha256 = "560d46dfb312cb70e1e9558e1fb587bdb41202ea49d21c3cf5fac5f33c8a163e"
recipe-source = { commit = "4700ceaf313bea09cb66f91801ce982672b60d4f", git = "https://github.com/otok-dev/recipes", path = "recipes/otok/0.6/windows" }
revision = 1
source = { sha256 = "04f83b5ec96ddd19bc77e426fc073b3c242cb8c6e091997e0f532b187afdfa18", url = "https://github.com/otok-dev/otok/releases/download/v0.6.8/otok-0.6.8.tar.gz" }
variant = "windows"
version = "0.6.8"

[deps.bzip2]
default-recipe = "apotocki/bzip2"
version = ">= 1.0"

[deps.curl]
default-recipe = "apotocki/curl"
requires-options = { tls = "schannel" }
version = ">= 8.0"

[deps.detours]
default-recipe = "apotocki/detours"
version = ">= 4.0"

[deps.inja]
default-recipe = "apotocki/inja"
version = ">= 3.4"

[deps.libarchive]
default-recipe = "apotocki/libarchive"
requires-options = { bzip2 = true, crypto = "none", lzma = true, xml = "none", zlib = true, zstd = true }
version = ">= 3.7"

[deps.lz4]
default-recipe = "apotocki/lz4"
version = ">= 1.7"

[deps.lzma]
default-recipe = "apotocki/lzma"
version = ">= 5.0"

[deps.nlohmann-json]
default-recipe = "apotocki/nlohmann-json"
version = ">= 3.11"

[deps.tomlplusplus]
default-recipe = "apotocki/tomlplusplus"
requires-options = { compiled = true }
version = ">= 3.4"

[deps.zlib]
default-recipe = "apotocki/zlib"
version = ">= 1.2"

[deps.zstd]
default-recipe = "apotocki/zstd"
version = ">= 1.4"

[platforms]
build-on = [ "windows/msvc" ]
supported = [ "windows" ]

[tool]
programs = [ "otok" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.25" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
