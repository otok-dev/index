api = 1
cxx-standard = ">= 17"
description = "Protocol Buffers, Google's data interchange format: the C++ runtime."
format = 1
keywords = [ "protobuf", "serialization", "rpc" ]
library = "protobuf"
license = "BSD-3-Clause"
linkage = [ "static" ]
recipe = "apotocki/protobuf"
recipe-sha256 = "3719131a40711751dfb0bf3108a18fa5b5404185d6482eb5e28ca4a1c46e0ab2"
recipe-source = { commit = "df3f6c49ed5b9892656e02ec512271d6906ebf3d", git = "https://github.com/otok-dev/recipes.git", path = "recipes/protobuf/36/android" }
revision = 3
source = { sha256 = "3d9642a662d10e68ebae5e53f14dcce5105684212d5078f8e0d47d1ab3ae6b64", url = "https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protobuf-36.2.tar.gz" }
variant = "android"
version = "36.2"

[deps.abseil]
default-recipe = "apotocki/abseil"
version = ">= 20260000"

[options.runtime]
default = "full"
type = "enum"
values = [ "full", "lite" ]

[options.zlib]
additive = true
default = false
type = "bool"

[platforms]
build-on = [ "*/ndk" ]
supported = [ "android" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
