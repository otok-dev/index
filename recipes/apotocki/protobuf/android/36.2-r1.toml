api = 1
cxx-standard = ">= 17"
description = "Protocol Buffers, Google's data interchange format: the C++ runtime."
format = 1
keywords = [ "protobuf", "serialization", "rpc" ]
library = "protobuf"
license = "BSD-3-Clause"
