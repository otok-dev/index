api = 1
cxx-standard = ">= 17"
description = "Protocol Buffers, Google's data interchange format: the C++ runtime, and protoc for the build machine."
format = 1
keywords = [ "protobuf", "serialization", "rpc" ]
library = "protobuf"
license = "BSD-3-Clause"
linkage = [ "static" ]
recipe = "apotocki/protobuf"
recipe-sha256 = "f94121e56aebe23cc42a691872385d721f9d5681b8519e42f470fc5f298d5468"
recipe-source = { commit = "5da01945f38d9afb64726f84ba66490b8096ee16", git = "https://github.com/otok-dev/recipes", path = "recipes/protobuf/36/linux" }
revision = 1
source = { sha256 = "3d9642a662d10e68ebae5e53f14dcce5105684212d5078f8e0d47d1ab3ae6b64", url = "https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protobuf-36.2.tar.gz" }
variant = "linux"
version = "36.2"

[deps.abseil]
default-recipe = "apotocki/abseil"
version = ">= 20260000"

[deps.zlib]
default-recipe = "apotocki/zlib"
version = ">= 1.2"
when = { option = "zlib" }

[options.runtime]
default = "full"
type = "enum"
values = [ "full", "lite" ]

[options.zlib]
additive = true
default = false
type = "bool"

[platforms]
build-on = [ "linux/gcc", "linux/clang" ]
supported = [ "linux" ]

[tool]
programs = [ "protoc" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
