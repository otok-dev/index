api = 1
cxx-standard = ">= 17"
description = "Protocol Buffers, Google's data interchange format: the C++ runtime, and protoc for the build machine."
format = 1
keywords = [ "protobuf", "serialization", "rpc" ]
library = "protobuf"
license = "BSD-3-Clause"
linkage = [ "static" ]
published = 2026-11-19T12:38:37Z
recipe = "apotocki/protobuf"
recipe-sha256 = "5886c1ff4e653f4cba5455a2d31d449dc22813bf7eeb104f750714d141214cc9"
recipe-source = { commit = "df3f6c49ed5b9892656e02ec512271d6906ebf3d", git = "https://github.com/otok-dev/recipes", path = "recipes/protobuf/36/linux" }
revision = 2
source = { sha256 = "3d9642a662d10e68ebae5e53f14dcce5105684212d5078f8e0d47d1ab3ae6b64", url = "https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protobuf-36.2.tar.gz" }
variant = "linux"
version = "36.2"

[deps.abseil]
default-recipe = "apotocki/abseil"
version = ">= 20260000"

[deps.zlib]
default-recipe = "apotocki/zlib"
version = ">= 1.2"
when = { option = "zlib" }

[options.runtime]
default = "full"
doc = "The runtime: full (libprotobuf: reflection, descriptors, text and JSON) or lite (libprotobuf-lite: messages optimized for code size, no reflection). A program uses one of them."
type = "enum"
values = [ "full", "lite" ]

[options.zlib]
additive = true
default = false
doc = "GzipOutputStream and ZeroCopyGzip streams, with zlib."
type = "bool"

[platforms]
build-on = [ "linux/gcc", "linux/clang" ]
supported = [ "linux" ]

[tool]
programs = [ "protoc" ]

[toolchains]
cmake = { default-recipe = "apotocki/cmake", version = ">= 3.20" }
ninja = { default-recipe = "apotocki/ninja", version = ">= 1.10" }
